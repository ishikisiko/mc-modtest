schema_version: 1

# Generated art facts (bones, cubes, atlas size, model scale, shadow radius, clip keyframes) live
# only in the three files tools/npcgen writes; this contract names them and never repeats them.
# tools/validate_custom_entities.py checks that the ids, paths, clip names, display names, spawn egg
# colours and the Java-pinned dimensions below agree with the files and the Java registration.

project:
  mod_id: myvillage
  java_package: com.example.myvillage
  minecraft_version: 1.21.1
  neoforge_version: 21.1.233
  java_version: 21

data_sources:
  model: assets/myvillage/npc/cultivator_model.json
  animations: assets/myvillage/npc/cultivator_animations.json
  texture: assets/myvillage/textures/entity/cultivator/cultivator.png
  art_generator: tools/npcgen/defs/cultivator.py

entity:
  id: cultivator
  resource_location: myvillage:cultivator
  display_name:
    zh_cn: 修仙者
    en_us: Cultivator
  fantasy_role: 宗门弟子模样的人形 NPC；月白长袍外罩藏青对襟长比甲，束发戴冠。敌友未定，本版本只是一个能站、能走、会看人的身体；世界模拟也用它作命簿人物在山门院中的临时化身（见 world_sim_avatar）
  kind: npc
  base_class: com.example.myvillage.entity.npc.NpcEntity
  java_class: com.example.myvillage.entity.npc.CultivatorEntity
  vanilla_superclass: net.minecraft.world.entity.PathfinderMob
  mob_category: misc
  temperament: undecided
  behavior_inheritance:
    source: com.example.myvillage.entity.npc.NpcEntity
    strategy: generic_npc_framework_subclass
    subclass_adds:
      - entity id (selects the client asset files)
      - plain-body attributes (health, movement speed) and the stroll speed modifier
    framework_adds:
      - the ledger avatar mode (NpcEntity#becomeLedgerAvatar), used only by the world simulation; see world_sim_avatar

physical:
  width: 0.6
  height: 1.9
  eye_height: 1.67
  shadow_radius_source: assets/myvillage/npc/cultivator_model.json#shadow_radius
  model_scale_source: assets/myvillage/npc/cultivator_model.json#scale
  fire_immune: false
  summonable: true
  saveable: true
  saveable_note: the entity type is saveable and a summoned cultivator is saved with its chunk; a world-sim avatar overrides shouldBeSaved() to false and is never stored (see world_sim_avatar)
  client_tracking_range: 10
  despawn_when_far_away: false
  leashable: false

attributes:
  source: com.example.myvillage.entity.npc.CultivatorEntity#createAttributes
  base: Mob.createMobAttributes()
  registered:
    - max_health
    - movement_speed
  note: placeholder body values until the friend-or-foe design replaces them

behavior:
  goals:
    - priority: 0
      id: float
    - priority: 5
      id: water_avoiding_random_stroll
    - priority: 6
      id: look_at_player
    - priority: 7
      id: random_look_around
  target_goals: []
  interaction:
    tameable: false
    breedable: false
    rideable: false
    trade: false
    dialogue: false
  combat:
    mode: none
    statement: It never attacks. A summoned cultivator can be hurt and killed like any mob and does not react to it; a world-sim avatar cannot be attacked or hurt (see world_sim_avatar).

state:
  synced:
    - id: ledger_person_id
      type: int
      default: -1
      source: com.example.myvillage.entity.npc.NpcEntity#DATA_LEDGER_PERSON
      meaning: the world-ledger person a world-sim avatar projects; -1 for a summoned cultivator
    - id: look
      type: string
      default: default
      source: com.example.myvillage.entity.npc.NpcEntity#DATA_LOOK
      meaning: the look (外观) name the client renders, one of CultivatorEntity.LOOKS (default, f_novice, f_adept); a spawn egg draws one at random, an avatar's is set by the world simulation
    - id: ledger_role
      type: string
      default: none
      source: com.example.myvillage.entity.npc.NpcEntity#DATA_LEDGER_ROLE
      meaning: the avatar's dialogue role in the ledger (none, steward or elder), set by the world simulation and never saved; none for a summoned cultivator
  persisted:
    - id: WorldSimPerson
      type: int
      source: com.example.myvillage.entity.npc.NpcEntity#LEDGER_PERSON_TAG
      written: only for a world-sim avatar, which is never stored with its chunk; a copy that escapes some other way (a structure template, data copied by command) loads as an avatar its manager does not know and is refused when it joins a level
    - id: Look
      type: string
      source: com.example.myvillage.entity.npc.NpcEntity#LOOK_TAG
      written: only when the look is not default; on load a name that CultivatorEntity.LOOKS does not list is ignored and the look stays default
  custom_state:
    statement: A summoned cultivator saves vanilla Mob state plus Look when its look is not default (ledger_person_id stays -1 and is not written; ledger_role is never written).

world_sim_avatar:
  statement: The world simulation projects ledger members who are at a realized sect gate as cultivators while a player is near; the ledger stays the only authority and the avatar is a temporary projection of it.
  manager: com.example.myvillage.sim.runtime.avatar.WorldSimAvatars
  mode: NpcEntity#becomeLedgerAvatar (ledger_person_id >= 0), set before the entity is added; irreversible
  spawned_by: the manager only, on courtyard cells from com.example.myvillage.sect.SectCourtyard#cells, one entity per person id
  removed_by: the manager (players gone, member no longer at the sect, ledger inactive, server stop), death from an invulnerability-bypassing source, or a command
  saveable: false
  attackable: false
  invulnerable: true (only sources that bypass invulnerability, such as /kill or the void, hurt it)
  fire_immune: true
  pushable: false
  goals_removed:
    - water_avoiding_random_stroll
  interaction: none (mobInteract passes without effect)
  name_tag: name · realm · sect (entity.myvillage.cultivator.avatar; the realm through world_sim.realm.<id>), always visible
  config: myvillage-world_sim-server.toml [avatars] (avatars_enabled, avatar_spawn_radius, max_avatars_per_sect, max_avatars)

rendering:
  route: vanilla
  custom_geometry: true
  custom_animation_files: true
  geckolib: false
  model_class: com.example.myvillage.client.entity.npc.NpcModel
  renderer_class: com.example.myvillage.client.entity.npc.NpcRenderer
  model_layer: myvillage:cultivator#main
  geo: myvillage:npc/cultivator_model.json
  animation: myvillage:npc/cultivator_animations.json
  base_texture: myvillage:textures/entity/cultivator/cultivator.png
  render_type: entity cut-out (a texel with zero alpha is a hole)
  texel_density: twice vanilla (the model file's scale is 0.5, one model unit is 1/32 block)
  final_texture_size:
    source: assets/myvillage/npc/cultivator_model.json#texture
  generator:
    owner: tools/npcgen
    definition: tools/npcgen/defs/cultivator.py
    check: python3 -m tools.npcgen build cultivator --check
    hand_edits: forbidden
  bones:
    source: assets/myvillage/npc/cultivator_model.json#bones
    look_bone: head
  layers:
    - crossed robe collar bands lying on the chest, the left lapel over the right
    - vest shell cut open down the front, with border bands along the opening and sloped shoulder caps
    - belt over the vest, with a buckle, two sash ends and a jade pendant hanging from it
    - sleeves from under the shoulder caps, deeper toward an open cuff with a hanging drape
    - two-tier skirt carried by the legs, vest panels over it front and back
    - head of a cranium over three jaw cubes that narrow toward the chin (flush with the face), and a nose
    - hair shell cut out round the face, bun with crown and pin, two ribbons, two loose strands, long back hair
  animations:
    - id: idle
      loop: true
      driver: always running on the client
    - id: walk
      loop: true
      driver: animateWalk, at the rate that keeps the planted foot still
    - id: hurt
      loop: false
      source: vanilla_living_entity_render_state
    - id: death
      loop: false
      source: vanilla_living_entity_render_state

texture_art_direction:
  silhouette: 修长人形，束发戴冠，斜肩盖袖，广袖垂袋，腰封收腰，裙摆两层外扩
  palette:
    robe: "#DBE3EC"
    dye: "#35869E"
    vest: "#2A3A6E"
    gold: "#C4A75C"
    jade: "#52B09A"
  face: 下颌用真实几何逐级收窄，脸长于宽；额头敞开、发际平直、鬓角到颅底；眉直接压在一行眼睛上，眼白在瞳孔两侧，眉尾在同一行淡入鬓角（剑眉入鬓）；无眉心印；嘴为三格低饱和色；以游戏内距离判断（preview --only face）
  shading: 每个纹素按它在模型上的三维位置上色：圆柱感明暗、上层投在下层的影子、凸起饰带旁的凹缝、布料褶皱、下摆与袖口的渐染
  forbidden:
    - 一刀切的平涂色块
    - 眉心印、独立的睫毛横条、阶梯状上挑的眉毛
    - 抗锯齿或平滑缩放
    - 半透明纹素（只允许完全透明的镂空）
    - 手工修改生成的贴图或模型文件

items:
  spawn_egg:
    enabled: true
    id: cultivator_spawn_egg
    primary_color: "#DBE3EC"
    secondary_color: "#2A3A6E"
    creative_tab: myvillage:main

sound:
  strategy: vanilla_defaults
  custom_sound_resources: false
  events:
    ambient: none
    hurt: minecraft:entity.generic.hurt
    death: minecraft:entity.generic.death

loot:
  table: myvillage:entities/cultivator
  intent: no drop in this version
  pools: []

spawn:
  natural: false
  biome_modifier: null
  spawn_placement: null
  routes:
    - /summon myvillage:cultivator
    - myvillage:cultivator_spawn_egg
    - world-sim avatar (not a spawn route a player uses; see world_sim_avatar)

acceptance:
  build: true
  dedicated_server_start: true
  summon_test: true
  spawn_egg_test: true
  save_reload_test: true
  natural_spawn_test: false
  multiplayer_observer_test: true
  automated:
    - python3 tools/validate_custom_entities.py
    - python3 -m tools.npcgen build cultivator --check
    - /usr/bin/python3 -m unittest tools.tests.test_validate_custom_entities tools.tests.test_npcgen tools.tests.test_npc_capture
    - ./gradlew test
    - ./gradlew build
  developer_evidence:
    - python3 -m tools.npcgen preview cultivator             # drawn without back-face culling, as entityCutoutNoCull does
    - python3 -m tools.npcgen preview cultivator --only face # the head from six angles, large and at in-game size
    - python3 -m tools.combat_capture npc   # parts idle, walk; out/preview/cultivator/ingame/
    - python3 tools/world_sim_avatar_evidence.py   # world-sim avatars on a built compound; out/preview/world_sim/avatars/
  visual_views:
    - front
    - side
    - three_quarter_front
    - three_quarter_back
  visual_states:
    - idle
    - walk
    - hurt
    - death
  human_verdict_required: true
  human_verdict_status: not_verified
  human_verdict_note: owner on 0.34.0, own PC, 2026-10-06 — clothes, back view, poses seen from behind and the walk accepted; the face rejected (像大佛的脸，没有俊朗英气). The 0.34.1 face and every other surface are not_verified; see the README ledger.

assumptions:
  - 当前仓库基线为 Minecraft 1.21.1、NeoForge 21.1.233、Java 21，mod id 为 myvillage，Java 包根为 com.example.myvillage。
  - 不使用玩家模型和玩家皮肤格式；模型、动画与贴图由 tools/npcgen 生成，复用妖兽的模型/动画文件 schema 与原版 ModelPart、AnimationDefinition，不引入 GeckoLib 或新依赖。
  - 敌友未定：本版本没有目标、攻击、交易、对话；后续设计在 NpcEntity 子类上添加，或把美术文件交给敌对框架使用。
  - 本版本不自然生成，没有掉落：只能 /summon 或刷怪蛋；另由世界模拟在玩家靠近已具现的山门时临时投影为化身，化身不存盘、不可伤害、不可对话。

out_of_scope:
  - disposition_friend_or_foe
  - combat
  - dialogue_and_trade
  - natural_spawning
  - drops
  - custom_audio
  - held_items
  - visual_variants

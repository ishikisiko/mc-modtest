default_modes:
  visual_or_aesthetic_goal: alignment_first
  mechanical_bug_or_failing_gate: implementation_first
  unclear_scope: planning_first
  final_acceptance: run_gates_then_handoff
owner_examples:
- owner: 用 GenOps 规划一下宗门远景剪影怎么改，先别动代码。
  commander_action: run planning pass on sect-worldgen.full, inspect artifacts, summarize
    proposed tasks
- owner: 继续上次工作，把已确认的实现方向做完。
  commander_action: resume the governed intent, implement the scoped task, run relevant
    gates
- owner: 大宅花园不接受，太散。
  commander_action: record/restate verdict, route to mansion-visual, produce a critique
    before generator edits
- owner: 用 CRAFT 拆解 candidate_003 这个徽派参考建筑。
  commander_action: route to reference-decomposition.full, run planning pass, write
    breakdown card with four buckets, leave verdict pending

version: 1
principle: 'Optional GenOps tools, enabled only by an explicit CRAFT or GenOps request.
  Default workflow: docs/WORKFLOW.md.'
owner_interface:
  primary: natural_language_conversation
  not_primary:
  - owner manually typing GenOps CLI commands
  - owner choosing low-level task ids before the commander has mapped the goal
  commander_responsibilities:
  - infer the pipeline from the stated goal
  - classify whether the request is CRAFT-required before protected edits
  - choose planning, implementation, visual review, regression, or release mode
  - run tools/genops/run_pipeline.py when useful, including its embedded front-door
    check
  - run tools/genops/validate_pipelines.py when pipeline governance changes
  - execute task work directly when the owner asks to proceed
  - run tools/genops/check_frontdoor.py for protected-path provenance checks
  - summarize owner-facing state and keep complete audit evidence available
owner_decision_interface:
  default_surface: decision_only
  owner_decides:
  - need and non-goals
  - scope or depth when there are real alternatives
  - implementation direction when trade-offs matter
  - aesthetic or product verdict
  - release-sensitive approval when required
  commander_owns:
  - change names
  - run ids
  - pipeline selection
  - task ids
  - worker routing
  - validation command selection
  - archive and closeout mechanics
  - evidence bookkeeping
  default_summary:
  - goal_status
  - scope_or_direction
  - validation_state
  - risk_or_blocker
  - human_decision_needed
  - next_decision
visibility_policy:
  owner_visible:
  - goal_status
  - scope_or_direction
  - validation_state
  - risk_or_blocker
  - human_decision_needed
  - next_decision
  audit_available:
  - run_id
  - pipeline
  - task_id
  - worker_ownership
  - artifacts
  - gates
  - raw_logs
  - manifest_path
  backend_evidence:
  - spec file discovery
  - validator/build commands
  - pipeline YAML paths
  - worker prompts and logs
  expose_backend_when:
  - owner asks for audit detail
  - a backend failure is the decision blocker
subagent_execution_policy:
  consequential_role_work_prefers_subagent: false
  commander_self_execution_allowed_for:
  - all scoped work; spawn subagents only when explicitly requested
  self_execution_evidence_field: commander_self_executed
  consequential_role_work:
  - design judgment
  - generator or runtime code edits
  - generated resource edits
  - validation or build gates
  - release metadata
  - human verdict handoff
auto_progression:
  default_after_owner_accepts_direction: continue_until_stop_condition
  implementation: tools/genops/commander.py
  state_machine_states:
  - intake
  - planning
  - ready_for_direction
  - implementation
  - validation
  - human_review_pending
  - accepted
  - rejected
  - accepted_with_changes
  - closeout_ready
  - archived
  state_machine_commands:
  - classify
  - start-run
  - continue-current
  - status
  - next-decision
  - record-verdict
  - closeout
  - summary
  stop_condition_source: tools/genops/commander.py STOP_RULES
  stop_conditions:
  - unresolved scope conflict
  - multiple valid aesthetic or product directions requiring owner judgment
  - required visual verdict
  - release/version/changelog approval
  - destructive or broad generated-resource rewrite
  - protected behavior boundary change outside accepted scope
  - failing gate
  - missing evidence
human_verdict_policy:
  prompt_when_required: true
  prompt_owner_for_pending_verdict: true
  prompt_shape: Ask whether the prepared evidence is OK, rejected, or accepted with
    changes.
  no_silent_acceptance: true
  verdicts:
  - pending
  - accept
  - reject
  - accept_with_changes
  - not_required
  - pause
  - reopen_discussion
archive_policy:
  default: auto_archive_when_green
  owner_initiated_archive_required: false
  action_owner: commander
  eligible_when:
  - all tasks are complete
  - front-door evidence is present and passing for protected paths
  - closeout evidence is present
  - required human verdict is recorded or not required
  - no closeout stop condition is present
  stop_conditions:
  - human verdict required but pending
  - release/version/changelog approval required
  - failed validation, build, or front-door gate
  - missing run evidence
  - implementation not landed
  - dirty unrelated protected paths
  post_archive_gates:
  - report the optional run closeout state
craft_required_intents:
- explicit CRAFT or GenOps request
frontdoor_exempt_intents:
- ordinary work without an explicit CRAFT or GenOps request
craft_required_summary_fields:
- goal_status
- scope_or_direction
- validation_state
- risk_or_blocker
- human_decision_needed
- next_decision
craft_required_audit_fields:
- run_id
- pipeline
- task_id
- worker_ownership
- artifacts
- gates
- raw_logs
- manifest_path

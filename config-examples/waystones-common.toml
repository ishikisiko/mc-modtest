# 复制到游戏或服务器的 config/waystones-common.toml；修改已有文件时仅替换相应费用项。
# 从传送石出发按 MyVillage 大境界与路程定价，同时保留背包按钮的五分钟冷却。
# 倍率与距离范围由世界的 serverconfig/myvillage-waystones-server.toml 控制。
[teleports]
enableCosts = true
enableCooldowns = true
warpRequirements = [
    "[source_is_waystone] scaled_add_item_cost(myvillage:waystone_spirit_stone_cost, myvillage:low_grade_spirit_stone, 1)",
    "[source_is_inventory_button] add_cooldown(inventory_button, 300)"
]

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>较大住宅的空间与外观草案</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground,#e6e8df);font:14px var(--font-sans,system-ui,sans-serif)}p{line-height:1.7;margin:8px 0}.muted{font-size:12px;color:var(--muted-foreground,#adb7a7)}nav,.controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:10px 0}button,a{font:inherit}button{color:inherit;border:1px solid var(--border,#56604d);border-radius:var(--radius,6px);background:var(--secondary,#2d3b2e);padding:8px 10px;cursor:pointer}button.active{background:var(--primary,#75876a);color:var(--primary-foreground,#fff)}#choices button{flex:1 1 28%;text-align:left}#choices small{display:block;opacity:.75;font-size:11px;margin-top:3px}#stage{position:relative;border-radius:var(--radius,8px);overflow:hidden;background:var(--card,#303b30)}canvas{display:block;width:100%;height:550px;touch-action:none}#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}#loading{position:absolute;bottom:12px;left:12px;background:var(--card,#303b30);padding:8px}label{display:inline-flex;align-items:center;gap:4px}input[type=range]{width:100px}#error{color:var(--destructive,#e2a8a3)}details{margin:8px 0;line-height:1.7}summary{cursor:pointer}a{color:var(--primary,#b2c99c)}@media(max-width:570px){canvas{height:430px}button{font-size:12px;padding:7px 9px}.controls{gap:6px}}
</style></head><body><nav id="choices" aria-label="选择住宅"></nav><p><b id="name"></b> <span id="stats" class="muted"></span></p><p id="description"></p><nav id="views" aria-label="选择视角"></nav><div id="stage"><canvas id="scene"></canvas><img id="poster" src="/*POSTER*/" alt="双院水廊宅全貌"><span id="loading">正在载入建筑模型…</span></div><div class="controls"><label><input id="roof" type="checkbox" checked>屋顶</label><label><input id="rooms" type="checkbox">房间标注</label><label><input id="routes" type="checkbox">步行路线</label><label><input id="doors" type="checkbox" checked>打开大门</label><label>剖切<input id="cut" type="range" min="2" max="36" step="0.25"><span id="cut-value">全部</span></label><button id="png">保存画面</button></div><p id="reason"></p><p id="concern" class="muted"></p><details><summary>查看房间和宅田安排</summary><p id="room-list"></p><p id="land"></p><p class="muted">“放进宅田地块”中的浅色区域只表示可继续规划的空间，通路、自建和种植范围都可调整。</p></details><p class="muted">拖动旋转，右键平移，滚轮缩放。建筑使用当前 Minecraft 与庭院构件的模型和像素材质；床和灰瓦细部作简化显示，完整曲线屋顶保留原模型。当前展示的住宅均为设计草案，本轮仅做三维预览，尚未接入游戏。</p><p id="error"></p><script src="setup.js"></script><script>
const SETUP=window.HOUSE_CHOICES_SETUP;
const first=SETUP.choices.find(c=>c.info.id===new URLSearchParams(location.search).get('house'))||SETUP.choices[0];document.querySelector('#name').textContent=first.info.name;document.querySelector('#description').textContent=first.info.description;
(async()=>{
async function unpack(s){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
for(const packed of SETUP.libraries){const s=document.createElement('script');s.textContent=await unpack(packed);document.head.append(s)}
const canvas=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0xc9d0c1);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
const camera=new THREE.PerspectiveCamera(43,1,.1,700),controls=new THREE.OrbitControls(camera,canvas);controls.minDistance=2;controls.maxDistance=240;controls.maxPolarAngle=Math.PI*.95;
scene.add(new THREE.HemisphereLight(0xfff5e3,0x65766b,.85));const sun=new THREE.DirectionalLight(0xffedd2,.8);sun.position.set(-45,90,-60);sun.target.position.set(25,4,25);scene.add(sun.target);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:1,far:250});sun.shadow.normalBias=.035;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0xbac2af}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);
const house=new THREE.Group(),plot=new THREE.Group();scene.add(house,plot);let marks,paths,meshes=[],D,choice,atlas,serial=0;
function array(s,T){return new T(Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer)}
function label(text,position,width=7){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='rgba(28,40,31,.86)';ctx.fillRect(0,0,512,96);ctx.fillStyle='#f0eee1';ctx.font='36px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,49);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,depthWrite:false}));s.position.fromArray(position);s.scale.set(width,width*96/512,1);s.renderOrder=5;return s}
function dispose(group){group.traverse(o=>{o.geometry?.dispose();if(o.material){for(const m of(Array.isArray(o.material)?o.material:[o.material])){if(m.map&&m.map!==atlas)m.map.dispose();m.dispose()}}});group.clear()}
let pending=false;function draw(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;renderer.render(scene,camera)})}
const cut=document.querySelector('#cut');
function visible(){if(!D)return;const y=+cut.value;renderer.clippingPlanes=y<D.size[1]?[new THREE.Plane(new THREE.Vector3(0,-1,0),y)]:[];for(const m of meshes)m.visible=(m.userData.layer!=='roof'||document.querySelector('#roof').checked)&&(m.userData.doorOpen==null||m.userData.doorOpen===document.querySelector('#doors').checked);marks.visible=document.querySelector('#rooms').checked;for(const m of marks.children)m.visible=m.userData.floor===undefined||m.userData.floor<y&&m.userData.floor>=(window.__floorMin||0);paths.visible=document.querySelector('#routes').checked;document.querySelector('#cut-value').textContent=y===D.size[1]?'全部':y+'格';renderer.shadowMap.needsUpdate=true;draw()}
window.setView=function(key){const v=D.views[key];if(!v)throw Error('未知机位 '+key);window.__floorMin=v.floor_min||0;const[ox,oz]=choice.info.plot_origin;house.position.set(v.plot?ox:0,0,v.plot?oz:0);plot.visible=!!v.plot;ground.visible=!v.plot;camera.position.fromArray(v.eye);camera.fov=v.fov||43;camera.updateProjectionMatrix();controls.target.fromArray(v.target);cut.value=v.cut||D.size[1];document.querySelector('#roof').checked=!v.cut;document.querySelector('#rooms').checked=!!v.rooms;if(v.open_doors!==undefined)document.querySelector('#doors').checked=v.open_doors;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));controls.update();visible();window.__view=key};
window.setChoice=async function(key){window.__ready=false;const turn=++serial,selected=SETUP.choices.find(c=>c.info.id===key);if(!selected)throw Error('未知住宅 '+key);const data=JSON.parse(await unpack(selected.packed));const texture=await new Promise((ok,bad)=>new THREE.TextureLoader().load(selected.atlas,ok,undefined,bad));if(turn!==serial){texture.dispose();return}choice=selected;D=data;dispose(house);dispose(plot);atlas?.dispose();atlas=texture;atlas.magFilter=atlas.minFilter=THREE.NearestFilter;atlas.generateMipmaps=false;atlas.encoding=THREE.sRGBEncoding;meshes=[];marks=new THREE.Group();paths=new THREE.Group();house.add(marks,paths);
for(const d of D.prototypes){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(array(d.positions,Float32Array),3));g.setAttribute('normal',new THREE.BufferAttribute(array(d.normals,Int8Array),3,true));g.setAttribute('uv',new THREE.BufferAttribute(array(d.uv,Float32Array),2));g.setIndex(new THREE.BufferAttribute(array(d.indices,Uint32Array),1));g.computeBoundingSphere();const m=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial({map:atlas,color:new THREE.Color(...d.tint).convertSRGBToLinear(),alphaTest:.3,side:THREE.DoubleSide,transparent:d.transparent,opacity:d.transparent?.75:1,depthWrite:!d.transparent}),d.instances.length);d.instances.forEach((p,i)=>m.setMatrixAt(i,new THREE.Matrix4().makeTranslation(...p)));m.instanceMatrix.needsUpdate=true;m.frustumCulled=false;m.userData={layer:d.layer,doorOpen:d.door_open};m.castShadow=!d.transparent;m.receiveShadow=true;house.add(m);meshes.push(m)}
for(const r of D.rooms){const[a,b,c,d]=r.bounds;const m=new THREE.Mesh(new THREE.PlaneGeometry(c-a,d-b),new THREE.MeshBasicMaterial({color:r.color,transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set((a+c)/2,r.floor_y+.025,(b+d)/2);m.userData.floor=r.floor_y;marks.add(m);const text=label(r.name,[(a+c)/2,r.floor_y+.65,(b+d)/2],8);text.userData.floor=r.floor_y;marks.add(text)}
const points=choice.checks.walk.tour.map(p=>new THREE.Vector3(...p));const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0xbc8049,depthTest:false}));line.renderOrder=6;paths.add(line);
const[pw,pd]=choice.info.plot_size,[ox,oz]=choice.info.plot_origin,[w,,d]=D.size;for(const[a,b,c,e]of[[0,0,ox,pd],[ox+w,0,pw,pd],[ox,0,ox+w,oz],[ox,oz+d,ox+w,pd]]){if(c<=a||e<=b)continue;const m=new THREE.Mesh(new THREE.BoxGeometry(c-a,2,e-b),new THREE.MeshLambertMaterial({color:0xc7c0af}));m.position.set((a+c)/2,1,(b+e)/2);m.receiveShadow=true;plot.add(m)}
const grid=[];for(let x=0;x<=pw;x+=8)grid.push(new THREE.Vector3(x,2.02,0),new THREE.Vector3(x,2.02,pd));for(let z=0;z<=pd;z+=8)grid.push(new THREE.Vector3(0,2.02,z),new THREE.Vector3(pw,2.02,z));plot.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(grid),new THREE.LineBasicMaterial({color:0x96978a,transparent:true,opacity:.6})));plot.add(label('留给自建、种植与接路的范围',[32,2.7,oz/2],26));
document.querySelector('#name').textContent=choice.info.name;document.querySelector('#stats').textContent=w+'×'+d+'格 · '+choice.info.author;document.querySelector('#description').textContent=choice.info.description;document.querySelector('#reason').textContent=choice.info.reason;document.querySelector('#concern').textContent='待看效果：'+choice.info.concern;document.querySelector('#room-list').textContent=D.rooms.map(r=>r.name+'（地板高度'+r.floor_y+'格）').join('、');document.querySelector('#land').textContent='64×72格宅田中，这套宅院外剩余'+(pw*pd-w*d)+'格，尚未扣除接路面积。';
document.querySelector('#views').replaceChildren();for(const[key,v]of Object.entries(D.views)){const b=document.createElement('button');b.textContent=v.name;b.dataset.view=key;b.onclick=()=>setView(key);document.querySelector('#views').append(b)}for(const b of document.querySelectorAll('[data-choice]'))b.classList.toggle('active',b.dataset.choice===key);cut.max=D.size[1];cut.value=D.size[1];setView(D.views[new URLSearchParams(location.search).get('view')]?new URLSearchParams(location.search).get('view'):'overview');document.querySelector('#loading')?.remove();document.querySelector('#poster')?.remove();window.__ready=true;window.__homeInfo={id:key,blocks:D.blocks,views:Object.keys(D.views)};return window.__homeInfo};
for(const c of SETUP.choices){const b=document.createElement('button');b.dataset.choice=c.info.id;const name=document.createElement('span');name.textContent=c.info.name;const author=document.createElement('small');author.textContent=c.info.author;b.append(name,author);b.onclick=()=>setChoice(c.info.id).catch(fail);document.querySelector('#choices').append(b)}
function fail(e){document.querySelector('#error').textContent='载入失败：'+e.message;console.error(e)}
for(const id of['roof','rooms','routes','doors'])document.querySelector('#'+id).onchange=visible;cut.oninput=visible;controls.addEventListener('change',draw);function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();draw()}addEventListener('resize',resize);document.querySelector('#png').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=choice.info.id+'-'+window.__view+'.png';a.click()};
resize();await setChoice(new URLSearchParams(location.search).get('house')||SETUP.choices[0].info.id);window.__inspect=()=>({id:choice.info.id,roofMeshes:meshes.filter(m=>m.visible&&m.userData.layer==='roof').length,doorsOpen:document.querySelector('#doors').checked,rooms:marks.visible,routes:paths.visible,plot:plot.visible});
})().catch(e=>{document.querySelector('#error').textContent='载入失败：'+e.message;console.error(e)});
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NAME__｜宗门蓝图</title>
<style>
:root{--ink:var(--foreground,#dce5df);--muted-ink:var(--muted-foreground,#a5b8ae);--line:var(--border,#405149);--surface:var(--secondary,#26382f);--panel:var(--card,#1e2c26);--highlight:var(--primary,#a5c5ad);--on-highlight:var(--primary-foreground,#15241c);--curve:var(--radius,8px);--type:var(--font-sans,system-ui,sans-serif)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:13px/1.65 var(--type);background:transparent}button{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:var(--curve);background:var(--surface);padding:6px 10px;cursor:pointer}button:hover,button.active{background:var(--highlight);color:var(--on-highlight)}button:focus-visible{outline:2px solid var(--ring,var(--highlight))}.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}.view{height:510px;position:relative;overflow:hidden;border-radius:var(--curve)}canvas{display:block;width:100%;height:510px;touch-action:none}.labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;padding:3px 6px;background:var(--panel);border:1px solid var(--line);border-radius:5px;font-size:11px}.hint{position:absolute;bottom:10px;left:12px;padding:6px 10px;border-radius:var(--curve);background:var(--panel);color:var(--muted-ink);font-size:11px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface);padding:20px;text-align:center}.status{padding:10px 0;color:var(--muted-ink);font-size:11px}.notes{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}.box{padding:16px;border-radius:var(--curve);background:var(--panel)}.box b{display:block;font-size:14px;margin-bottom:6px}.box p{margin:4px 0;color:var(--muted-ink);font-size:12px}.anchors{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.anchors button{font-size:11px}.plan{display:none;margin-bottom:10px;background:var(--panel);border-radius:var(--curve);padding:12px}.plan svg{width:100%;height:510px;display:block}.plan text{font-family:var(--type);font-size:5px}.plan .labeltext{paint-order:stroke;stroke:var(--panel);stroke-width:2px;fill:var(--ink)}@media(max-width:520px){.view,canvas{height:430px}.notes{grid-template-columns:1fr}.toolbar button{font-size:11px}.plan svg{height:430px}}
</style></head><body>
<div class="toolbar" id="views"></div>
<div class="view" id="stage"><canvas id="scene" tabindex="0" aria-label="可旋转和缩放的宗门同源方块施工预览"></canvas><div class="labels" id="labels"></div><div class="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 1单位=1格</div><div class="loading" id="loading">正在展开宗门施工几何…</div></div>
<div class="plan" id="plan"></div>
<div class="status" id="status"></div>
<div class="notes"><div class="box"><b>__NAME__</b><div id="design"></div></div><div class="box"><b>查看建筑与入口</b><div class="anchors" id="anchors"></div><p id="scope">可旋转查看同源施工模型。实际世界按种子和区域选择布局，山门外接支路，内部保持各自山径与桥廊。</p><p>预览将自然接坡统一示意到山门标高；游戏中接回实际地形。自由相机不代表玩家行走验收。</p></div></div>
<script>
async function start(){const b=Uint8Array.from(atob('__PAYLOAD__'),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const payload=JSON.parse(await new Response(s).text());new Function(payload.three)();new Function(payload.orbit)();new Function('DATA',payload.viewer)(payload.data);}
start().catch(e=>{document.getElementById('loading').textContent='预览加载失败：'+e.message;console.error(e);});
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木格双开大门设计</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground,#e2e5da);font:14px var(--font-sans,system-ui,sans-serif)}p{line-height:1.7;margin:8px 0}.muted{font-size:12px;color:var(--muted-foreground,#a8b2a2)}nav,.controls,.links{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}button,a{font:inherit}button{border:1px solid var(--border,#4a5948);border-radius:var(--radius,6px);padding:8px 11px;background:var(--secondary,#29382a);color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--primary,#71865e);color:var(--primary-foreground,#fff)}a{color:var(--primary,#a8c594)}.facts{padding:12px 16px;border-radius:var(--radius,8px);background:var(--card,#253326)}#stage{position:relative;border-radius:var(--radius,8px);overflow:hidden}canvas{display:block;width:100%;height:580px;touch-action:none;background:var(--card,#253326)}#loading{position:absolute;bottom:12px;left:12px;padding:8px;background:var(--card,#253326);border-radius:5px}label{display:inline-flex;gap:6px;align-items:center}input[type=range]{width:150px}#error{color:var(--destructive,#dca1a1)}@media(max-width:570px){canvas{height:500px}button{font-size:12px;padding:7px 9px}}
</style></head><body><p>木格双开大门：上部木棂、下部实心木板，配暗铜门环和低门槛。门框与住宅现有的木柱、粉墙使用相同像素材质。</p><div class="facts"><b>净开口 3×4 格 · 外框 5×5 格</b><p class="muted">两扇向内开启90°，门后预留3格深的开合空间。灰色方块人高1.8格，用于对照比例。</p></div><nav id="modes"><button data-mode="standalone" aria-pressed="true">单独看大门</button><button data-mode="compare">与原版门对照</button><button data-mode="facade">主屋局部试装</button></nav><div id="stage"><canvas id="scene"></canvas><span id="loading">正在加载门体和主屋局部…</span></div><div class="controls"><button data-angle="0">闭合</button><button data-angle="45">半开</button><button data-angle="90">全开</button><label>开度 <input id="angle" type="range" min="0" max="90" value="0"><span id="angle-value">0°</span></label><button id="reset">复位视角</button></div><p class="muted" id="view-note">拖动旋转，右键平移，滚轮缩放。上部木棂保留通透感，门扇转轴位于两侧门框后方。</p><div class="links"><a href="https://assets.ishiki333hhh.win/previews/player-house-door-study-20261117/door-design.json" target="_blank">尺寸与构件数据</a><a href="https://assets.ishiki333hhh.win/previews/player-house-door-study-20261117/checks.json" target="_blank">几何检查</a><a href="https://assets.ishiki333hhh.win/previews/player-house-door-study-20261117/manifest.json" target="_blank">源与产物清单</a></div><p class="muted">本页为独立设计稿。开合动画和主屋局部试装用于看比例；尚未制作游戏中的新门，也未替换现有住宅蓝图。</p><p id="error"></p><script>
const PACKED=/*DATA*/;
(async()=>{
const unpack=async text=>JSON.parse(await new Response(new Blob([Uint8Array.from(atob(text),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const D=await unpack(PACKED),C=D.config;
for(const text of D.libraries){const code=await new Response(new Blob([Uint8Array.from(atob(text),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const s=document.createElement('script');s.textContent=code;document.head.append(s)}
const canvas=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0xc7d0c0);const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.outputEncoding=THREE.sRGBEncoding;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;
const camera=new THREE.PerspectiveCamera(38,1,.05,300),orbit=new THREE.OrbitControls(camera,canvas);orbit.minDistance=3;orbit.maxDistance=70;orbit.maxPolarAngle=Math.PI*.86;
scene.add(new THREE.HemisphereLight(0xfff5dd,0x70836f,.8));const sun=new THREE.DirectionalLight(0xffefda,.85);sun.position.set(-10,22,-13);sun.target.position.set(2.5,2,0);scene.add(sun.target);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:100});sun.shadow.normalBias=.02;scene.add(sun);
let mode='standalone',angle=0,animation=0,pendingDraw=false;
const textureCache={},materials={};
function texture(key){if(!textureCache[key]){const t=new THREE.TextureLoader().load(D.textures[key],()=>draw());t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;textureCache[key]=t;}return textureCache[key]}
function material(key){if(!materials[key])materials[key]=new THREE.MeshLambertMaterial({map:texture(key),side:THREE.DoubleSide});return materials[key]}
const door=new THREE.Group(),left=new THREE.Group(),right=new THREE.Group(),context=new THREE.Group(),old=new THREE.Group(),person=new THREE.Group();scene.add(door,context,old,person);door.add(left,right);left.position.fromArray(C.leaf.left_pivot);right.position.fromArray(C.leaf.right_pivot);
function makeBox(p,parent,mirror=false){const a=p.bounds.slice();if(mirror){[a[0],a[3]]=[-a[3],-a[0]]}const size=a.slice(3).map((v,i)=>v-a[i]),center=a.slice(0,3).map((v,i)=>(v+a[i+3])/2),g=new THREE.BoxGeometry(...size),positions=g.attributes.position,normals=g.attributes.normal,uv=g.attributes.uv;
 for(let i=0;i<positions.count;i++){const x=positions.getX(i)+center[0],y=positions.getY(i)+center[1],z=positions.getZ(i)+center[2];if(Math.abs(normals.getY(i))>.5)uv.setXY(i,x,z);else if(Math.abs(normals.getX(i))>.5)uv.setXY(i,z,y);else uv.setXY(i,x,y)}
 const m=new THREE.Mesh(g,material(p.material));m.position.fromArray(center);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
for(const p of D.frame)makeBox(p,door);for(const p of D.leaf){makeBox(p,left);makeBox(p,right,true)}
const oldGroups={};for(const f of D.old){const b=oldGroups[f.texture]||(oldGroups[f.texture]={p:[],n:[],u:[],i:[]}),i=b.p.length/3;for(let k=0;k<4;k++){b.p.push(...f.p[k]);b.n.push(...f.n);b.u.push(...f.uv[k])}b.i.push(i,i+1,i+2,i,i+2,i+3)}
for(const[key,b]of Object.entries(oldGroups)){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(b.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(b.n,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(b.u,2));g.setIndex(b.i);const m=new THREE.Mesh(g,material(key));m.castShadow=m.receiveShadow=true;old.add(m)}
function decode(s,T){const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new T(bytes.buffer)}
const atlas=await new Promise((ok,bad)=>new THREE.TextureLoader().load(D.context.atlas,ok,undefined,bad));atlas.magFilter=atlas.minFilter=THREE.NearestFilter;atlas.generateMipmaps=false;atlas.encoding=THREE.sRGBEncoding;
for(const p of D.context.scene.prototypes){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(decode(p.positions,Float32Array),3));g.setAttribute('normal',new THREE.BufferAttribute(decode(p.normals,Int8Array),3,true));g.setAttribute('uv',new THREE.BufferAttribute(decode(p.uv,Float32Array),2));g.setIndex(new THREE.BufferAttribute(decode(p.indices,Uint32Array),1));const m=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial({map:atlas,color:new THREE.Color(...p.tint).convertSRGBToLinear(),alphaTest:.3,side:THREE.DoubleSide,transparent:p.transparent,opacity:p.transparent?.75:1}),p.instances.length);p.instances.forEach((v,i)=>m.setMatrixAt(i,new THREE.Matrix4().makeTranslation(...v)));m.instanceMatrix.needsUpdate=true;m.frustumCulled=false;m.castShadow=m.receiveShadow=true;context.add(m)}
function figureBox(bounds,color){const a=bounds,size=a.slice(3).map((v,i)=>v-a[i]),m=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshLambertMaterial({map:texture('stone'),color}));m.position.fromArray(a.slice(0,3).map((v,i)=>(v+a[i+3])/2));m.castShadow=m.receiveShadow=true;person.add(m)}
figureBox([-.25,1.5,-.25,.25,2,.25],0xcbd0cb);figureBox([-.25,.75,-.125,.25,1.5,.125],0x768b83);figureBox([-.5,.75,-.125,-.25,1.5,.125],0xaab8af);figureBox([.25,.75,-.125,.5,1.5,.125],0xaab8af);figureBox([-.25,0,-.125,0,.75,.125],0x526462);figureBox([0,0,-.125,.25,.75,.125],0x526462);person.scale.setScalar(C.player_reference_height/2);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshLambertMaterial({color:0xacb7a0}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);

function draw(){if(pendingDraw)return;pendingDraw=true;requestAnimationFrame(()=>{pendingDraw=false;renderer.render(scene,camera)})}
function pose(degrees){angle=degrees;left.rotation.y=-degrees*Math.PI/180;right.rotation.y=degrees*Math.PI/180;document.querySelector('#angle').value=degrees;document.querySelector('#angle-value').textContent=Math.round(degrees)+'°';document.querySelectorAll('[data-angle]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.angle===Math.round(degrees))));draw()}
function cameraView(){const a=D.context.anchor,c=D.context.center;let eye,target;
 if(mode==='facade'){eye=[c[0]-8,c[1]+5,a[2]-13];target=c}else if(mode==='compare'){eye=[10,5.5,-13];target=[3.5,2.2,.5]}else{eye=[7,5.2,-10];target=[2.5,2.35,.5]}
 camera.position.fromArray(eye);orbit.target.fromArray(target);const factor=Math.max(1,1.15/camera.aspect);camera.position.sub(orbit.target).multiplyScalar(factor).add(orbit.target);orbit.update();draw()}
function setMode(next){mode=next;context.visible=next==='facade';old.visible=next==='compare';door.position.fromArray(next==='facade'?D.context.anchor:[0,0,0]);old.position.set(7,0,0);person.position.fromArray(next==='facade'?D.context.player:[-1.15,0,.1]);sun.target.position.copy(door.position).add(new THREE.Vector3(2.5,2,.5));sun.position.copy(sun.target.position).add(new THREE.Vector3(-12,22,-15));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===next)));document.querySelector('#view-note').textContent=next==='compare'?'同时显示1×2格原版深色橡木门，两者使用相同尺度；灰色方块人高1.8格。':next==='facade'?'主屋门口局部试装：三格台阶与柱间开口共用中轴。此处仅显示局部设计，原住宅蓝图未修改。':'拖动旋转，右键平移，滚轮缩放。上部木棂保留通透感，门扇转轴位于两侧门框后方。';renderer.shadowMap.needsUpdate=true;cameraView()}
function animateTo(end){cancelAnimationFrame(animation);const start=angle,t0=performance.now();function tick(now){const t=Math.min(1,(now-t0)/650),ease=t*t*(3-2*t);pose(start+(end-start)*ease);if(t<1)animation=requestAnimationFrame(tick);else{renderer.shadowMap.needsUpdate=true;draw()}}animation=requestAnimationFrame(tick)}
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();cameraView()}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>setMode(b.dataset.mode);for(const b of document.querySelectorAll('[data-angle]'))b.onclick=()=>animateTo(+b.dataset.angle);document.querySelector('#angle').oninput=e=>{cancelAnimationFrame(animation);pose(+e.target.value);renderer.shadowMap.needsUpdate=true};document.querySelector('#reset').onclick=cameraView;window.addEventListener('resize',resize);orbit.addEventListener('change',draw);
resize();setMode(new URLSearchParams(location.search).get('mode')||'standalone');pose(+(new URLSearchParams(location.search).get('angle')||0));document.querySelector('#loading').remove();window.__doorReady=true;window.DOOR_STUDY={setMode,setAngle:degrees=>{cancelAnimationFrame(animation);pose(degrees);renderer.shadowMap.needsUpdate=true},get mode(){return mode},get angle(){return angle},checks:D.checks};
})().catch(e=>{document.querySelector('#error').textContent='设计预览加载失败：'+e.message;console.error(e)});
</script></body></html>

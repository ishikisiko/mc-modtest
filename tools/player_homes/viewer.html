<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月洞风格住宅模板</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground,#e3e5dc);font:14px var(--font-sans,system-ui,sans-serif)}p{line-height:1.7;margin:8px 0}.muted{font-size:12px;color:var(--muted-foreground,#adb8aa)}nav,.controls,.downloads{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}button,a{font:inherit;color:inherit}button,.downloads a{border:1px solid var(--border,#465649);background:var(--secondary,#27372b);border-radius:var(--radius,6px);padding:8px 11px;cursor:pointer;text-decoration:none}button.active{background:var(--primary,#758d66);color:var(--primary-foreground,#fff)}#stage{position:relative;background:var(--card,#233127);border-radius:var(--radius,8px);overflow:hidden}canvas{display:block;width:100%;height:540px;touch-action:none}#loading{position:absolute;bottom:12px;left:12px;background:var(--card,#233127);padding:8px;border-radius:5px}label{display:inline-flex;gap:5px;align-items:center}input[type=range]{width:125px}#error{color:var(--destructive,#d8a097)}@media(max-width:570px){canvas{height:440px}button,.downloads a{font-size:12px;padding:7px 9px}}
</style></head><body><p><b id="name"></b> <span class="muted" id="stats"></span></p><p id="description" class="muted"></p><nav id="views"></nav><div id="stage"><canvas id="scene"></canvas><span id="loading">正在载入同源方块模型…</span></div><div class="controls"><label id="door-control"><input id="doors" type="checkbox">打开双开门</label><label><input id="roof" type="checkbox" checked>显示屋顶</label><label>剖切高度 <input id="cut" type="range" min="3"><span id="cut-value">全部</span></label><button id="png">保存当前画面</button></div><p class="muted">拖动旋转，右键平移，滚轮缩放。预览读取蓝图对应的方块模型和像素材质；双开门可切换开合状态，床为简化显示。</p><div class="downloads"><a data-file="home.schem" download>SCHEM</a><a data-file="../yuanxian-0.135.1.jar" download>配套模组0.135.1</a><a data-file="home.nbt" download>NBT</a><a data-file="plan.svg" target="_blank">宅田地块中的占地</a><a data-file="checks.json" target="_blank">检查记录</a></div><p class="muted">独立选型模板；三套新宅需要源仙0.135.1或更高版本的双开门及月洞水院构件。尚未加入游戏中的选房菜单，未写入玩家世界。</p><p id="error"></p><script>
/*SCENE*/
const SETUP=/*SETUP*/;
(async()=>{
document.querySelector('#name').textContent=SETUP.name;document.querySelector('#description').textContent=SETUP.description;document.querySelectorAll('[data-file]').forEach(a=>a.href=SETUP.base+a.dataset.file);
for(const packed of SETUP.libraries){const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const script=document.createElement('script');script.textContent=text;document.head.append(script)}

const bytes=Uint8Array.from(atob(window.__estatePacked),c=>c.charCodeAt(0));const D=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const canvas=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0xc5d0bf);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;
const camera=new THREE.PerspectiveCamera(40,1,.1,800),controls=new THREE.OrbitControls(camera,canvas);controls.minDistance=4;controls.maxDistance=250;controls.maxPolarAngle=Math.PI*.9;
scene.add(new THREE.HemisphereLight(0xfff6e4,0x687b6c,.8));const sun=new THREE.DirectionalLight(0xffedd2,.8);sun.position.set(-50,100,-60);sun.target.position.set(D.size[0]/2,4,D.size[2]/2);scene.add(sun.target);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-85,right:85,top:85,bottom:-85,near:1,far:300});sun.shadow.normalBias=.035;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({color:0xaeba9f}));ground.rotation.x=-Math.PI/2;ground.position.set(D.size[0]/2,-.03,D.size[2]/2);ground.receiveShadow=true;scene.add(ground);
const texture=await new Promise((ok,bad)=>new THREE.TextureLoader().load(SETUP.atlas,ok,undefined,bad));texture.magFilter=texture.minFilter=THREE.NearestFilter;texture.generateMipmaps=false;texture.encoding=THREE.sRGBEncoding;
function array(s,T){const raw=atob(s),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new T(bytes.buffer)}
const house=new THREE.Group(),yard=new THREE.Group();scene.add(house);scene.add(yard);yard.visible=false;const meshes=[];for(const d of D.prototypes){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(array(d.positions,Float32Array),3));g.setAttribute('normal',new THREE.BufferAttribute(array(d.normals,Int8Array),3,true));g.setAttribute('uv',new THREE.BufferAttribute(array(d.uv,Float32Array),2));g.setIndex(new THREE.BufferAttribute(array(d.indices,Uint32Array),1));g.computeBoundingSphere();const m=new THREE.InstancedMesh(g,new THREE.MeshLambertMaterial({map:texture,color:new THREE.Color(...d.tint).convertSRGBToLinear(),alphaTest:.3,side:THREE.DoubleSide,transparent:d.transparent,opacity:d.transparent?.75:1,depthWrite:!d.transparent}),d.instances.length);d.instances.forEach((p,i)=>m.setMatrixAt(i,new THREE.Matrix4().makeTranslation(...p)));m.instanceMatrix.needsUpdate=true;m.frustumCulled=false;m.userData.layer=d.layer;m.userData.doorOpen=d.door_open;m.castShadow=!d.transparent;m.receiveShadow=true;house.add(m);meshes.push(m)}
const [pw,pd]=SETUP.plot.size,[ox,oz]=SETUP.plot.origin,[hw,hd]=SETUP.plot.house;
for(const[a,b,c,d]of[[0,0,ox,pd],[ox+hw,0,pw,pd],[ox,0,ox+hw,oz],[ox,oz+hd,ox+hw,pd]]){if(c<=a||d<=b)continue;const tex=new THREE.TextureLoader().load(SETUP.soil,()=>{if(yard.visible)draw()});tex.magFilter=tex.minFilter=THREE.NearestFilter;tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(c-a,d-b);tex.encoding=THREE.sRGBEncoding;const m=new THREE.Mesh(new THREE.BoxGeometry(c-a,2,d-b),new THREE.MeshLambertMaterial({map:tex}));m.position.set((a+c)/2,1,(b+d)/2);m.receiveShadow=true;yard.add(m)}
const cut=document.querySelector('#cut');cut.max=SETUP.height;cut.value=SETUP.height;
let pendingDraw=false;function draw(){if(pendingDraw)return;pendingDraw=true;requestAnimationFrame(()=>{pendingDraw=false;renderer.render(scene,camera)})}function visible(){const y=+cut.value;renderer.clippingPlanes=y<SETUP.height?[new THREE.Plane(new THREE.Vector3(0,-1,0),y)]:[];for(const m of meshes)m.visible=(m.userData.layer!=='roof'||document.querySelector('#roof').checked)&&(m.userData.doorOpen==null||m.userData.doorOpen===document.querySelector('#doors').checked);document.querySelector('#cut-value').textContent=y===SETUP.height?'全部':y+'格';draw()}
window.setView=function(key){const v=D.views[key];house.position.set(v.plot?ox:0,0,v.plot?oz:0);yard.visible=!!v.plot;ground.visible=!v.plot;renderer.shadowMap.needsUpdate=true;camera.fov=v.fov||40;camera.updateProjectionMatrix();camera.position.fromArray(v.eye);controls.target.fromArray(v.target);cut.value=v.cut||SETUP.height;document.querySelector('#roof').checked=!v.cut;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));controls.update();visible()};
for(const[key,v]of Object.entries(D.views)){const b=document.createElement('button');b.dataset.view=key;b.textContent=v.name;b.onclick=()=>setView(key);document.querySelector('#views').append(b)}
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();draw()}window.addEventListener('resize',resize);controls.addEventListener('change',draw);cut.oninput=visible;document.querySelector('#roof').onchange=visible;document.querySelector('#doors').onchange=()=>{renderer.shadowMap.needsUpdate=true;visible()};document.querySelector('#door-control').hidden=!SETUP.doors;document.querySelector('#png').onclick=()=>{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=SETUP.id+'.png';a.click()};
document.querySelector('#stats').textContent=D.size[0]+'×'+D.size[2]+'格；'+D.blocks.toLocaleString()+'个方块';resize();setView(new URLSearchParams(location.search).get('view')||'overview');document.querySelector('#loading').remove();window.__ready=true;window.__homeInfo={id:SETUP.id,blocks:D.blocks,meshes:meshes.length,views:Object.keys(D.views)};
})().catch(e=>{document.querySelector('#error').textContent='模型加载失败：'+e.message;console.error(e)});
</script></body></html>

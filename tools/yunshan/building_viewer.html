</style><main><header><a href="../index.html">← 返回功能建筑总览</a><h1 id="name"></h1><p id="summary"></p><p class="muted">实际蓝图方块生成的离线色块预览；家具采用简化形状，功能方块读取已有模型轮廓。不是游戏截图。</p></header><nav id="views"></nav><canvas id="scene"></canvas><p id="caption"></p><p id="error"></p><section><div class="panel"><h2>空间与设施</h2><ul id="spaces"></ul><p class="muted" id="services"></p></div><div class="panel"><h2>独立另存</h2><p id="site"></p><p class="muted" id="stage"></p><p class="muted">空白容器不含物资。设施的游戏内交互、放置效果与玩家验收尚待验证。</p></div></section><div class="downloads" id="downloads"></div><p class="muted">拖动旋转，滚轮缩放。默认蓝图低 z 朝前；带 <code>_site</code> 的版本已按原地块旋转。文件中的空气用于替换旧屋，安装前需在世界副本核对位置。</p></main>

const scene=new THREE.Scene();scene.background=new THREE.Color('#c8d4d2');const canvas=document.querySelector('#scene');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});}catch(e){document.querySelector('#error').textContent='无法启用 WebGL：'+e.message;throw e;}

const materials={},buckets=new Map(),all=[],signMeshes=[];

function color(n){if(n.includes('deepslate'))return '#454c4d';if(n.includes('quartz'))return '#e5e1d3';if(n.includes('calcite'))return '#dedbcf';if(n.includes('amethyst'))return '#9b83b0';if(n.includes('blackstone'))return '#45434b';if((n.includes('bricks')||n==='minecraft:brick_wall')&&!n.includes('stone'))return '#976857';if(n.includes('stone_brick'))return '#93958d';if(n.includes('andesite'))return '#a4a79d';if(n.includes('stone')||n.includes('anvil'))return '#787c78';if(n.includes('log'))return '#69513a';if(n.includes('bamboo'))return '#b09a63';if(n.includes('lantern'))return '#edbd72';if(n.includes('bed'))return n.includes('white')?'#ddd7c3':'#a35a4e';if(n.includes('leaves')||n.includes('azalea'))return '#6f8854';if(n.includes('forging'))return '#747571';if(n.includes('alchemy'))return '#72816a';if(n.includes('water'))return '#637d83';return '#a08258';}

if(n.endsWith('_stairs')){const t=p.half==='top',lo=t?0:.5,hi=t?.5:1;return [[0,t?.5:0,0,1,t?1:.5,1],{east:[.5,lo,0,1,hi,1],west:[0,lo,0,.5,hi,1],south:[0,lo,.5,1,hi,1],north:[0,lo,0,1,hi,.5]}[p.facing]];}
if(n.endsWith('_trapdoor')){if(p.open!=='true')return [[0,p.half==='top'?.8125:0,0,1,p.half==='top'?1:.1875,1]];const bars=[];for(const u of [0,.42,.88]){bars.push([u,0,0,u+.12,1,.18]);bars.push([0,u,0,1,u+.12,.18]);}return bars.map(b=>p.facing==='north'?[b[0],b[1],b[2]+.82,b[3],b[4],b[5]+.82]:p.facing==='west'?[b[2]+.82,b[1],b[0],b[5]+.82,b[4],b[3]]:p.facing==='east'?[b[2],b[1],b[0],b[5],b[4],b[3]]:b);}
if(n.endsWith('_door'))return [p.facing==='west'?[.82,0,0,1,1,1]:p.facing==='east'?[0,0,0,.18,1,1]:p.facing==='north'?[0,0,.82,1,1,1]:[0,0,0,1,1,.18]];
if(n.endsWith('_wall_sign'))return [[0,.25,.88,1,.75,1]];
if(n.endsWith('_wall'))return [[.3,0,.3,.7,1,.7]];
if(n.endsWith('_fence'))return [[.375,0,.375,.625,1,.625]];
if(n.endsWith('_pressure_plate'))return [[.05,0,.05,.95,.06,.95]];
if(n==='minecraft:chain')return [[.44,0,.44,.56,1,.56]];
if(n.endsWith('_bed'))return [[0,0,0,1,.56,1]];
if(n==='minecraft:lantern')return [[.3,.1,.3,.7,.65,.7],[.44,.65,.44,.56,p.hanging==='true'?1:.78,.56]];
if(n.includes('cauldron'))return [[0,0,0,1,.2,1],[0,.2,0,.15,1,1],[.85,.2,0,1,1,1],[.15,.2,0,.85,1,.15],[.15,.2,.85,.85,1,1],[.15,.65,.15,.85,.68,.85]];
if(n==='minecraft:anvil')return [[.1,0,.1,.9,.2,.9],[.3,.2,.3,.7,.75,.7],[.05,.75,.2,.95,1,.8]];
if(n==='minecraft:grindstone')return [[.2,0,.2,.3,.5,.8],[.7,0,.2,.8,.5,.8],[.3,.25,.15,.7,1,.85]];
if(n.startsWith('minecraft:potted_'))return [[.3,0,.3,.7,.35,.7],[.45,.35,.45,.55,.95,.55],[.2,.5,.3,.8,.75,.7]];
if(n==='minecraft:lectern')return [[.1,0,.1,.9,.15,.9],[.35,.15,.35,.65,.7,.65],[0,.7,0,1,.9,1]];
return [f];}
function addBox(x,y,z,b,c,rotation=null,facing='north'){const [x0,y0,z0,x1,y1,z1]=b;const scale=new THREE.Vector3(x1-x0,y1-y0,z1-z0);let center=new THREE.Vector3((x0+x1)/2,(y0+y1)/2,(z0+z1)/2),q=new THREE.Quaternion();if(rotation){const axis=new THREE.Vector3(rotation.axis==='x'?1:0,rotation.axis==='y'?1:0,rotation.axis==='z'?1:0),o=new THREE.Vector3(...rotation.origin.map(v=>v/16));q.setFromAxisAngle(axis,rotation.angle*Math.PI/180);center.sub(o).applyQuaternion(q).add(o);}
const angle={north:0,east:-Math.PI/2,south:Math.PI,west:Math.PI/2}[facing]||0;if(angle){const rq=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),angle);center.sub(new THREE.Vector3(.5,0,.5)).applyQuaternion(rq).add(new THREE.Vector3(.5,0,.5));q.premultiply(rq);}center.add(new THREE.Vector3(x,y,z));const matrix=new THREE.Matrix4().compose(center,q,scale);if(!buckets.has(c))buckets.set(c,[]);buckets.get(c).push({matrix,y,z});}
for(const [x,y,z,state]of D.blocks){const [n,s]=state.split('[');const p=Object.fromEntries((s||'').replace(']','').split(',').filter(Boolean).map(s=>s.split('=')));if(D.models[n]){const model=D.models[n];for(const e of model.elements){const face=Object.values(e.faces||{})[0];let texture=face?.texture||'';if(texture.startsWith('#'))texture=model.textures[texture.slice(1)]||n;addBox(x,y,z,[...e.from.map(v=>v/16),...e.to.map(v=>v/16)],color(texture),e.rotation,p.facing);}continue;}
for(const b of shapes(n,p))addBox(x,y,z,b,n.startsWith('minecraft:potted_')&&b[1]>.3?'#6d8c51':color(n));}
for(const [c,items]of buckets){const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat(c),items.length);mesh.castShadow=true;mesh.receiveShadow=true;items.forEach((b,i)=>mesh.setMatrixAt(i,b.matrix));mesh.userData.items=items;scene.add(mesh);all.push(mesh);}
for(const s of D.signs){const c=document.createElement('canvas');c.width=512;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='#b49c73';ctx.fillRect(0,0,512,256);ctx.fillStyle='#302b22';ctx.textAlign='center';ctx.font='bold 65px serif';ctx.fillText(s.messages[1],256,120);ctx.font='30px serif';ctx.fillText(s.messages[2],256,180);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.DoubleSide}));mesh.position.set(s.pos[0]+.5,s.pos[1]+.5,s.pos[2]+.875);mesh.rotation.y=Math.PI;mesh.userData={y:s.pos[1],z:s.pos[2]};scene.add(mesh);signMeshes.push(mesh);}

const target=[W/2,H*.43,L/2],viewDefs={full:{label:'建筑全貌',pos:[W+12,H+10,-L-10],target,caption:P.summary},front:{label:'正面',pos:[W/2,H*.6,-L-16],target:[W/2,H*.45,L*.4],caption:'街道方向的入口与立面。'},cut:{label:'室内剖切',pos:[W+8,H+19,-L-6],target:[W/2,P.cut_y*.35,L/2],caption:P.spaces.join('；')+'。'},rear:{label:'背面',pos:[-12,H+10,L+22],target,caption:'后方用地与屋顶收口。'},entry:{label:'入口视角',pos:P.eye,target:P.eye_target,caption:'入口视角。视点是空间预览，不代表实机碰撞验收。'}};
if(P.upper_cut)viewDefs.upper={label:'二层剖切',pos:[W+8,H+14,-L-6],target:[W/2,6.5,L/2],caption:'两间客房与后侧走廊，楼梯井保持贯通。'};
let active='full';const zero=new THREE.Matrix4().makeScale(0,0,0);
function visible(item,name){if(name==='cut')return item.y<P.cut_y;if(name==='upper')return item.y>=P.upper_cut[0]&&item.y<P.upper_cut[1]&&item.z>=3;return true;}
window.setView=function(name){active=name;const v=viewDefs[name];for(const mesh of all){mesh.userData.items.forEach((item,i)=>mesh.setMatrixAt(i,visible(item,name)?item.matrix:zero));mesh.instanceMatrix.needsUpdate=true;}for(const mesh of signMeshes)mesh.visible=visible(mesh.userData,name);ground.visible=name!=='upper';camera.position.fromArray(v.pos);controls.target.fromArray(v.target);controls.update();document.querySelector('#caption').textContent=v.caption;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));draw();};
for(const [key,v]of Object.entries(viewDefs)){const b=document.createElement('button');b.textContent=v.label;b.dataset.view=key;b.onclick=()=>setView(key);document.querySelector('#views').append(b);}

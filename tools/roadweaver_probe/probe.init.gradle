// Explicit test-only source and dependency. This script never changes release source sets.
gradle.afterProject { project ->
    if (project != project.rootProject) return
    def probeJar = System.getenv('MYVILLAGE_ROAD_PROBE_JAR')
    if (!probeJar || !project.file(probeJar).isFile()) {
        throw new GradleException('Set MYVILLAGE_ROAD_PROBE_JAR to the pinned RoadWeaver jar')
    }
    project.dependencies.add('implementation', project.files(probeJar))
    project.sourceSets.main.java.srcDir(project.file('tools/roadweaver_probe/java'))
    project.tasks.named('jar') {
        doFirst { throw new GradleException('Road experiment sources must never be packaged in the release jar') }
    }
    def runtimeJar = System.getenv('MYVILLAGE_ROAD_PROBE_RUNTIME_JAR')
    if (runtimeJar) {
        def verify = project.tasks.register('verifyRoadProbeRuntime', Exec) {
            dependsOn project.tasks.named('compileJava')
            workingDir project.projectDir
            commandLine 'python3', 'tools/roadweaver_probe/verify_runtime.py', runtimeJar,
                    System.getenv('MYVILLAGE_ROAD_PROBE_OUT') + '/runtime-identity.json'
        }
        project.tasks.matching { it.name in ['runAcceptanceServer', 'runClient'] }.configureEach { dependsOn verify }
    }
    project.neoForge.runs.named('acceptanceServer') {
        programArgument 'nogui'
        gameDirectory = project.file(System.getenv('MYVILLAGE_ROAD_PROBE_GAME'))
    }
}

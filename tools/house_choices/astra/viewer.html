}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{方案:cfg[house].name,显示屋顶:roof,查看楼层:floor},privateContent:{house,roof,floor,viewName}}).catch(()=>{});}
function preset(v){viewName=v;isPlan=v==='plan';isPerson=v==='person';let c=cfg[house],was=fullPlot;fullPlot=v==='plot';if(isPlan){roof=false;roofInput.checked=false;namesInput.checked=true;eye=[32,90,c.bounds[2]/2];target=[32,0,c.bounds[2]/2];span=c.bounds[2]+6;}else if(isPerson){eye=[...c.person];target=[...c.aim];}else if(fullPlot){eye=[87,75,-42];target=[32,0,36];span=92;namesInput.checked=true;}else{eye=[...c.eye];target=[...c.target];span=c.span;namesInput.checked=false;}if(was!==fullPlot)build();else upload();save();pending=true;}
root.querySelectorAll('[data-house]').forEach(b=>b.addEventListener('click',()=>{house=+b.dataset.house;roof=roofInput.checked;floor=+floorInput.value;fullPlot=false;build();preset('overview');save();}));root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>preset(b.dataset.view)));roofInput.addEventListener('change',()=>{roof=roofInput.checked;upload();save();});floorInput.addEventListener('change',()=>{floor=+floorInput.value;roof=false;roofInput.checked=false;upload();save();});namesInput.addEventListener('change',()=>{refreshLabels();pending=true;});
let pointers=new Map(),drag=null,pinch=null;

 if(drag.pan||e.shiftKey){let dir=norm(sub(target,eye)),right=norm(cross([dir[0],dir[1],-dir[2]],[0,1,0]));if(!Number.isFinite(right[0]))right=[1,0,0];let sc=span/canvas.clientHeight;let move=[-right[0]*dx*sc,dy*sc,right[2]*dx*sc];eye=eye.map((x,i)=>x+move[i]);target=target.map((x,i)=>x+move[i]);}
 else if(isPerson){let v=sub(target,eye),r=Math.hypot(...v),yaw=Math.atan2(v[0],v[2])-dx*.006,pitch=Math.max(-1.4,Math.min(1.4,Math.asin(v[1]/r)+dy*.006));target=[eye[0]+r*Math.cos(pitch)*Math.sin(yaw),eye[1]+r*Math.sin(pitch),eye[2]+r*Math.cos(pitch)*Math.cos(yaw)];}
 else{let v=sub(eye,target),r=Math.hypot(...v),yaw=Math.atan2(v[0],-v[2])-dx*.006,pitch=Math.max(.035,Math.min(1.53,Math.asin(v[1]/r)+dy*.006));eye=[target[0]+r*Math.cos(pitch)*Math.sin(yaw),target[1]+r*Math.sin(pitch),target[2]-r*Math.cos(pitch)*Math.cos(yaw)];isPlan=false;}viewName='custom';pending=true;});

canvas.addEventListener('wheel',e=>{e.preventDefault();if(isPerson){const f=norm(sub(target,eye)),s=e.deltaY*.015;eye=eye.map((v,i)=>v+f[i]*s);target=target.map((v,i)=>v+f[i]*s);}else span=Math.max(8,Math.min(140,span*Math.exp(e.deltaY*.001)));pending=true;},{passive:false});
function restore(s){if(!s)return;const p=s.privateContent||s;if(Number.isInteger(p.house)&&p.house>=0&&p.house<3)house=p.house;if(typeof p.roof==='boolean')roof=p.roof;if(p.floor===1||p.floor===2)floor=p.floor;roofInput.checked=roof;floorInput.value=String(floor);build();const c=cfg[house];eye=[...c.eye];target=[...c.target];span=c.span;pending=true;}
build();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));new ResizeObserver(()=>{pending=true;}).observe(canvas);

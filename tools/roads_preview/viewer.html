<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四种驿道样段</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground);font-family:var(--font-sans,system-ui)}button{font:inherit;color:inherit}p{line-height:1.6;margin:7px 0}.intro{margin-bottom:14px}.muted{color:var(--muted-foreground)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sample{background:var(--card);border:1px solid var(--border);padding:0;text-align:left;overflow:hidden;border-radius:var(--radius,12px);cursor:pointer}.sample[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:1px}.sample canvas{width:100%;height:230px;display:block}.caption{padding:12px 14px}.caption strong{display:block;font-size:18px}.caption span{display:block;font-size:12px;color:var(--muted-foreground);margin-top:4px}.caption p{font-size:13px}.viewer{background:var(--card);padding:16px;border-radius:var(--radius,12px);margin-top:18px}.viewer canvas{display:block;width:100%;height:360px;touch-action:none;cursor:grab;border-radius:8px}.viewer canvas:active{cursor:grabbing}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar button{border:1px solid var(--border);border-radius:7px;background:transparent;padding:7px 11px;cursor:pointer}.toolbar button:hover{color:var(--primary)}#selected{font-size:19px;font-weight:650}#tradeoff{font-size:13px}.hint{font-size:12px}a{color:var(--primary)}.foot{font-size:13px;margin-top:12px}@media(max-width:480px){.sample canvas{height:185px}.caption{padding:10px}.caption strong{font-size:16px}.caption p{font-size:12px}.viewer{padding:12px}.viewer canvas{height:310px}}
</style></head><body><main><div class="intro"><p>四种离线三维样段。每段 36 格，包含平地、弯段和 3 格缓坡；使用项目现有道路纹理。</p><p class="muted">先选外观方向。未改游戏道路，截图不代表原生 Minecraft 效果或玩法验收。C 为三格支路，其余为五格通行。</p></div><div class="grid">__CARDS__</div><section class="viewer"><div id="selected">正在载入三维样段…</div><p id="tradeoff" class="muted"></p><canvas id="detail" role="img" aria-label="可拖动旋转的道路样段"></canvas><div class="toolbar"><button data-view="overview">斜看全段</button><button data-view="near">近看路肩</button><button data-view="top">俯看铺装</button><button data-view="slope">近地看坡</button><button id="compare">同步旋转四段</button></div><p class="hint muted">点选 A—D；拖动旋转，滚轮或双指缩放。全段可看缓坡，近景可看铺装与收边。</p></section><p class="foot">可以组合用途，例如 B 作野外主路、C 作山地支路、D 用于西漠；A 更适合正式城门外。<a href="__BASE_URL__index.html" target="_blank" rel="noopener">打开完整交互页</a></p><p id="error" hidden></p></main><script type="module">__SCRIPT__</script></body></html>

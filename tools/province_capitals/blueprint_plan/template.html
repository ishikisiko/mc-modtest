<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__CITY_TITLE__</title><style>
:root{--ink:var(--foreground,#e7e9e4);--soft:var(--muted-foreground,#acb9ae);--line:var(--border,#42534b)}*{box-sizing:border-box}body{margin:0;font:13px/1.6 var(--font-sans,system-ui,sans-serif);color:var(--ink)}button,select{font:inherit;background:var(--secondary,#293b33);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius,6px);padding:6px 10px;cursor:pointer}button[aria-pressed=true]{background:var(--primary,#567f70);color:var(--primary-foreground,#fff)}button:focus-visible,select:focus-visible{outline:2px solid var(--ring,#b2dac2);outline-offset:2px}.toolbar,.layers,.legend{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}.count{color:var(--soft);font-size:12px;margin-bottom:9px}.stage{height:570px;position:relative;border-radius:var(--radius,6px);overflow:hidden;background:var(--card,#233329)}canvas{width:100%;height:100%;display:block;touch-action:none}canvas[hidden]{display:none}.legend{font-size:11px;color:var(--soft);margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:2px}.layers{font-size:12px}.layers label{display:flex;gap:4px;align-items:center;cursor:pointer}.layers input{accent-color:var(--primary,#75a38d)}.detail{background:var(--card,#24362c);padding:16px;border-radius:var(--radius,6px);margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail strong{font-size:15px}.detail p{margin:4px 0;color:var(--soft);font-size:12px}.foot{color:var(--soft);font-size:11px;margin:8px 0 0}.help{position:absolute;left:10px;bottom:10px;color:var(--popover-foreground,#e7e9e4);background:var(--popover,#293b33e8);padding:5px 9px;border-radius:var(--radius,6px);font-size:11px;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--card,#24362c);padding:16px}.loading[hidden]{display:none}.issue{color:var(--warning,#e5b875)}
@media(max-width:480px){.stage{height:510px}.detail{grid-template-columns:1fr}.toolbar button{padding:6px 8px}.count{font-size:11px}}
</style></head><body>
<div class="count" id="count">正在编译预览…</div>
<div class="toolbar"><button id="planMode" aria-pressed="true">整城蓝图</button><button id="spaceMode" aria-pressed="false">三维对照</button><select id="district" aria-label="选择街坊"><option value="all">全城</option></select><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">－</button><button id="reset">复位</button></div>
<div class="layers" id="layers"></div>
<div class="stage" id="stage"><canvas id="map" aria-label="可选择地块与庭院的总平面蓝图"></canvas><canvas id="space" hidden aria-label="来自同一蓝图的三维地形建筑与庭院方案"></canvas><div id="loading" class="loading">正在展开同源蓝图与三维几何…</div><div class="help" id="help">点击房屋或庭院查看归属 · 拖动平移 · 滚轮缩放</div></div>
<div class="legend"><span><i style="background:#7ba384"></i>私家院</span><span><i style="background:#c5a56c"></i>公共庭院</span><span><i style="background:#e5c773"></i>拟增门洞</span><span><i style="background:#aa8750"></i>公共接路</span><span><i style="background:#536e85"></i>现有房屋</span><span><i style="background:#bd7263"></i>待处理</span></div>
<div class="detail"><div><strong id="selectedName">整城关系</strong><p id="selectedText"></p></div><div><strong id="selectedType">保留原有地形，整理房屋与院落</strong><p id="selectedConnection"></p></div></div>
<p class="foot">__FOOT__</p>
<script>(async()=>{try{const raw=Uint8Array.from(atob('__PAYLOAD__'),c=>c.charCodeAt(0));const p=JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text());(0,eval)(p.three);(0,eval)(p.orbit);new Function('DATA','GEOMETRY',p.viewer)(p.plan,p.scene);}catch(e){document.getElementById('loading').textContent='预览载入失败：'+e.message;console.error(e);}})();</script></body></html>

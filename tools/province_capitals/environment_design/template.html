<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八州地标与两城环境设计</title><style>
:root{--ink:var(--foreground,#e9e8e0);--line:var(--border,#42514a)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:13px/1.6 var(--font-sans,system-ui,sans-serif);background:transparent}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius,6px);padding:7px 11px;background:var(--secondary,#293932);color:var(--secondary-foreground,#e9e8e0)}button[aria-pressed=true]{background:var(--primary,#56816e);color:var(--primary-foreground,#fff);border-color:var(--primary,#56816e)}button:focus-visible{outline:2px solid var(--ring,#98c5ad);outline-offset:3px}.modes,.cities,.views{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.cities:empty{display:none}.modes button{font-weight:650}.badge{font-size:11px;color:var(--muted-foreground,#a6b5a9);align-self:center;margin-left:auto}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px}.stage{height:600px;position:relative;min-width:0;overflow:hidden;border-radius:var(--radius,6px)}canvas{display:block;width:100%;height:100%;touch-action:none}aside{padding:16px;border-radius:var(--radius,6px);background:var(--card,#202c26);max-height:600px;overflow:auto}h2{font-size:17px;line-height:1.5;margin:0 0 8px}.type{color:var(--chart-2,#c5ab70);font-size:12px}.text{font-size:12px;color:var(--muted-foreground,#b3bdb1);margin:10px 0 18px}.info{padding:12px;border-radius:var(--radius,6px);background:var(--secondary,#293932);font-size:12px;margin-top:12px}.help{position:absolute;bottom:10px;left:10px;right:10px;pointer-events:none;font-size:11px;background:var(--popover,#24352ce8);color:var(--popover-foreground,#e9e8e0);padding:9px 12px;border-radius:var(--radius,6px)}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--secondary,#293932);z-index:4;font-size:15px;padding:24px;text-align:center}.foot{font-size:11px;color:var(--muted-foreground,#a6b5a9);margin:10px 0 0}.layers{display:grid;gap:8px}.layers label{font-size:12px;display:flex;gap:6px;align-items:center}.layers input{accent-color:var(--primary,#56816e)}
@media(max-width:540px){.workspace{grid-template-columns:1fr}.stage{height:480px}aside{max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}aside>div:first-child{grid-column:1/-1}.badge{margin-left:0;display:block;width:100%}.text{margin:7px 0 12px}.views button,.cities button{font-size:12px;padding:6px 9px}}
.loading[hidden]{display:none}
</style></head><body>
<nav class="modes" id="modes" aria-label="审阅范围"></nav><nav class="cities" id="cities" aria-label="八州主地标"></nav><div class="views" id="views" aria-label="观察视角"></div>
<div class="workspace"><div class="stage" id="stage"><canvas id="view" aria-label="可拖动旋转与缩放的真实三维设计"></canvas><div class="loading" id="loading">正在展开设计几何…</div><div class="help">拖动旋转 · 右键或双指平移 · 滚轮缩放 · 点击物件查看名称<br>1 单位＝1 方块；人物高 1.8 格。设计材质示意，非游戏截图。</div></div>
<aside><div><h2 id="name"></h2><div id="kind" class="type"></div><p id="intent" class="text"></p></div><div><strong>世界观作用</strong><p id="function" class="text"></p><div id="stats" class="info"></div></div><div><strong>观察图层</strong><div class="layers" id="layers"></div><div id="selected" class="info">可点击物件定位其名称。</div></div></aside></div>
<p class="foot" id="scope">独立设计阶段 · 不覆盖旧世界 · 游戏碰撞、功能、性能与玩家接受尚未验证</p>
<script>
(async()=>{try{const raw=Uint8Array.from(atob('__PAYLOAD__'),c=>c.charCodeAt(0));const decoded=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const payload=JSON.parse(decoded);(0,eval)(payload.three);(0,eval)(payload.orbit);new Function('SCENES',payload.viewer)(payload.scenes);}catch(e){document.getElementById('loading').textContent='预览未能载入：'+e.message;console.error(e);}})();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>中州云山 · 正式方块模板</title>
<style>body{margin:0;background:var(--background,#10171b);color:var(--foreground,#e3e8df);font:15px/1.6 system-ui}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:24px;margin:0}p{max-width:900px;color:#afc0bd}select,button{padding:9px;background:#273637;color:inherit;border:1px solid #50716d;border-radius:4px}#view{width:100%;height:600px;background:#192327;border:1px solid #405653;border-radius:7px}#stats{padding:12px 0;color:#d6c496}#note{font-size:13px}canvas{display:block}</style></head><body><main>
<h1>中州云山 · 正式 Minecraft 方块模板</h1><p>本页显示正式导出器使用的真实方块几何，可选择民居、服务商铺、宫殿、塔阁、亭和桥。完整城市保留原作 1200×1440 山水范围；山基以一格精度 heightfield 交运行时逐列生成。</p>
<select id="model"></select> <button id="reset">复位视角</button><div id="stats"></div><div id="view"></div><p id="note">生成展示，不是 Minecraft 画面。纹理采用材质示意色；碰撞、步行、水流、原生生成、FPS、多人和玩家外观均未验证，测试与编译未运行。旧白模预览仍是独立文件，不能作为本批实机证据。</p>
<script>__THREE__</script><script>__ORBIT__</script><script>
const report=__REPORT__,payload='__PAYLOAD__';
const view=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color('#192327');
const camera=new THREE.PerspectiveCamera(40,1,.1,1000),renderer=new THREE.WebGLRenderer({antialias:true});view.append(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xdce9ed,0x625f42,.95));let sun=new THREE.DirectionalLight(0xffe9c6,.9);sun.position.set(30,60,20);scene.add(sun);
let group=new THREE.Group();scene.add(group);let current;
const color=s=>{const n=s.split(':')[1].split('[')[0];if(n.includes('water'))return 0x528a9c;if(n.includes('prismarine'))return 0x416864;if(n.includes('sandstone'))return 0xc2ab63;if(n.includes('deepslate'))return 0x39454a;if(n.includes('log')||n.includes('stripped'))return 0x544231;if(n.includes('planks')||n.includes('spruce'))return 0x917354;if(n.includes('red_terracotta'))return 0x8b4539;if(n.includes('glass'))return 0x7fa5aa;if(n.includes('bed'))return 0xd9d5be;if(n.includes('calcite')||n.includes('white_terracotta'))return 0xcfc9b7;return 0x949489};
function geometry(state){let h=1,y=0;if(state.includes('_slab[')&&!state.includes('type=double')){h=.5;y=state.includes('type=top')?.25:-.25;}if(state.includes('_stairs[')){const shape=new THREE.Group();return null;}return new THREE.BoxGeometry(1,h,1)}
function reset(){let box=new THREE.Box3().setFromObject(group),size=box.getSize(new THREE.Vector3()),mid=box.getCenter(new THREE.Vector3()),r=Math.max(size.x,size.y,size.z)*1.55;controls.target.copy(mid);camera.position.copy(mid).add(new THREE.Vector3(r,r*.65,r));controls.update()}
function show(m){current=m;scene.remove(group);group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()});group=new THREE.Group();scene.add(group);const byState=new Map();for(const c of m.cells){if(!byState.has(c[3]))byState.set(c[3],[]);byState.get(c[3]).push(c)}
for(const [s,cells]of byState){const material=new THREE.MeshLambertMaterial({color:color(s)}),matrix=new THREE.Matrix4();const parts=[];if(s.includes('_stairs[')){const top=s.includes('half=top');parts.push([1,.5,1,0,top?.25:-.25,0]);let dx=0,dz=0;if(s.includes('facing=east'))dx=.25;if(s.includes('facing=west'))dx=-.25;if(s.includes('facing=south'))dz=.25;if(s.includes('facing=north'))dz=-.25;parts.push([dx? .5:1,.5,dz?.5:1,dx,top?-.25:.25,dz]);}else{let h=1,y=0;if(s.includes('_slab[')&&!s.includes('type=double')){h=.5;y=s.includes('type=top')?.25:-.25}parts.push([1,h,1,0,y,0]);}
for(const p of parts){let mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(p[0],p[1],p[2]),material,cells.length);cells.forEach((c,i)=>{matrix.makeTranslation(c[0]+p[3],c[1]+p[4]+.5,c[2]+p[5]);mesh.setMatrixAt(i,matrix)});group.add(mesh)}}
document.getElementById('stats').textContent=`全城 ${report.buildings} 座 / 民居 ${report.houses} / 商铺 ${report.shops} · ${report.tiles} 区块列 · ${(report.resource_bytes/1048576).toFixed(2)} MiB · 建筑最高 Y=${report.top_building_y} ｜ 当前 ${m.id} · ${m.roof}`;reset()}
async function start(){const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),models=JSON.parse(await new Response(stream).text()),sel=document.getElementById('model');models.forEach((m,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=m.id;sel.append(opt)});sel.onchange=()=>show(models[+sel.value]);show(models[0]);document.getElementById('reset').onclick=reset;}
new ResizeObserver(()=>{renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix()}).observe(view);
function draw(){requestAnimationFrame(draw);controls.update();renderer.render(scene,camera)}draw();start().catch(e=>document.getElementById('stats').textContent='载入失败：'+e.message);
</script></main></body></html>

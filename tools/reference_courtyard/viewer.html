</style><main><h1>月洞水院</h1><p>依照三张参考图建立的真实体素模型：临水门亭、曲线山墙、白墙月洞门、木桥与连续圆门回廊。</p><p class="muted" id="stats"></p><nav id="views"></nav><div id="stage"><canvas id="scene"></canvas><div id="loading">正在加载体素几何…</div></div><p id="error"></p><div class="info"><p id="caption"></p><p><label><input type="checkbox" id="water" checked>显示池水</label> <label><input type="checkbox" id="roof" checked>显示屋顶</label></p></div><p class="muted">拖动旋转 · 右键平移 · 滚轮缩放。可切换回廊内景或去顶查看真实结构；全部视角来自同一个模型。</p><div class="downloads"><a href="courtyard.vox" download>下载 VOX · 可编辑体素</a><a href="courtyard.glb" download>下载 GLB · 三维模型</a><a href="source.zip" download>下载建模源文件</a><a href="manifest.json" download>模型信息与检查结果</a><button id="capture">保存当前视角 PNG</button></div><p class="muted">每个体素对应 0.25 米。此为独立建模样稿，并非 Minecraft 方块结构或游戏截图；未接入模组、未修改存档。参考图未展示的背面和连接处作了补全。</p></main>
<script>/*THREE*/</script><script>/*ORBIT*/</script><script>
const D=/*DATA*/;
const cfg=D.config;document.querySelector('#stats').textContent=`${cfg.size.join(' × ')} 体素包围盒 · ${D.voxel_count.toLocaleString()} 个实心体素 · ${cfg.voxel_meters} 米 / 体素 · 无植被`;
const canvas=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#d7e1df');
let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});}catch(e){document.querySelector('#error').textContent='WebGL 无法启用：'+e.message;throw e;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
const camera=new THREE.PerspectiveCamera(43,1,.2,1800),controls=new THREE.OrbitControls(camera,canvas);controls.maxDistance=600;controls.minDistance=2;controls.maxPolarAngle=Math.PI*.92;
scene.add(new THREE.HemisphereLight(0xfff5df,0x8a9790,.8));const sun=new THREE.DirectionalLight(0xffedcc,.9);sun.position.set(242,220,-70);sun.target.position.set(96,0,75);scene.add(sun.target);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-155,right:155,top:140,bottom:-140,near:1,far:600});sun.shadow.bias=-.0001;sun.shadow.normalBias=.35;scene.add(sun);
const fill=new THREE.DirectionalLight(0xc4d9e1,.22);fill.position.set(160,80,140);scene.add(fill);
function decode(s,T){const str=atob(s),a=new Uint8Array(str.length);for(let i=0;i<str.length;i++)a[i]=str.charCodeAt(i);return new T(a.buffer);}
const meshes=[],mats={};
for(const d of D.parts){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(decode(d.positions,Float32Array),3));geo.setAttribute('normal',new THREE.BufferAttribute(Float32Array.from(decode(d.normals,Int8Array)),3));geo.setIndex(new THREE.BufferAttribute(decode(d.indices,Uint32Array),1));geo.computeBoundingSphere();const key=d.material+'/'+d.part;if(!mats[key]){const water=d.part==='water';mats[key]=new THREE.MeshStandardMaterial({color:new THREE.Color(cfg.palette[d.material]).convertSRGBToLinear(),roughness:water?.2:.95,metalness:0,transparent:water,opacity:water?.74:1,side:water?THREE.DoubleSide:THREE.FrontSide,depthWrite:!water,emissive:d.material==='lamp'?0xc18c32:0,emissiveIntensity:.45});}const m=new THREE.Mesh(geo,mats[key]);m.name=key;m.userData.part=d.part;m.castShadow=d.part!=='water';m.receiveShadow=true;scene.add(m);meshes.push(m);}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),new THREE.MeshLambertMaterial({color:new THREE.Color(0xc2c9bc).convertSRGBToLinear()}));ground.rotation.x=-Math.PI/2;ground.position.set(96,-.2,72);ground.receiveShadow=true;scene.add(ground);
let active='overview';function draw(){renderer.render(scene,camera);}function visibility(){for(const m of meshes)m.visible=(m.userData.part!=='roof'||document.querySelector('#roof').checked)&&(m.userData.part!=='water'||document.querySelector('#water').checked);draw();}
window.setView=function(key){const v=cfg.views[key];active=key;camera.fov=v.fov||43;camera.updateProjectionMatrix();camera.position.set(cfg.size[0]-v.eye[0],v.eye[1],v.eye[2]);controls.target.set(cfg.size[0]-v.target[0],v.target[1],v.target[2]);document.querySelector('#roof').checked=!(v.hide||[]).includes('roof');visibility();controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));document.querySelector('#caption').textContent=v.label+' · 实际模型视角';draw();};
for(const [key,v]of Object.entries(cfg.views)){const b=document.createElement('button');b.textContent=v.label;b.dataset.view=key;b.onclick=()=>setView(key);document.querySelector('#views').append(b);}
for(const id of ['water','roof'])document.querySelector('#'+id).onchange=visibility;
document.querySelector('#capture').onclick=()=>{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='courtyard-'+active+'.png';a.click();};
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();draw();}controls.addEventListener('change',draw);window.addEventListener('resize',resize);resize();setView('overview');document.querySelector('#loading').remove();window.__ready=true;window.__previewInfo={voxelCount:D.voxel_count,meshCount:meshes.length,triangles:renderer.info.render.triangles,views:Object.keys(cfg.views)};
</script></html>

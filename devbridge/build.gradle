plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
}

// NeoForge 21.1.x / Minecraft 1.21.1 targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // These runs are only for developing DevBridge itself.
        // When using DevBridge in your own mod project, you don't need them —
        // just drop the built jar into that project's run mods folder.
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // log4j-core is on the runtime classpath already (Minecraft ships it);
    // we only need it at compile time to attach our in-memory appender.
    compileOnly 'org.apache.logging.log4j:log4j-core:2.22.1'
}

// Self-check of the game-free world logic (WorldFiles, WorldOps): a plain main, no test framework.
sourceSets {
    selfCheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Checks folder names, the world marker, snapshot copies and trash moves, and operation tracking'
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'dev.devbridge.endpoint.WorldFilesCheck'
}

tasks.named('check') { dependsOn 'selfCheck' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

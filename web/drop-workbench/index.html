<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掉落工作台 · 源仙</title><meta name="description" content="选择原版与源仙物品，编辑怪物掉落并自动同步到统一掉落表。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%237ed7b8' d='M8 18 32 5l24 13v28L32 59 8 46z'/%3E%3Cpath fill='%23172022' d='m32 12 17 10-17 10-17-10zm-3 26v13L15 43V30zm6 0 14-8v13l-14 8z'/%3E%3C/svg%3E"><link rel="stylesheet" href="https://assets.ishiki333hhh.win/drop-workbench/style.css"><script defer src="https://assets.ishiki333hhh.win/drop-workbench/app.js"></script></head>
<body><header class="topbar"><a class="brand" href="#"><span class="brand-mark">源</span><span>源仙<span class="brand-divider">/</span><b>掉落工作台</b></span></a><div class="top-actions"><span id="save-state" class="status"><i></i>正在连接统一掉落表</span><button id="refresh" class="quiet">刷新规则</button><button id="history" class="quiet">历史版本</button><button id="unlock" class="primary">解锁编辑</button></div></header>
<div class="workspace"><aside class="sidebar"><div class="sidebar-top"><span class="eyebrow">规则目录</span><button id="add-rule" class="small-button" aria-label="新增规则">＋</button></div><nav id="tabs" class="tabs"><button data-tab="entities" class="active">生物</button><button data-tab="overrides">场景</button><button data-tab="additions">追加</button></nav><label class="search sidebar-search"><span>⌕</span><input id="rule-search" placeholder="搜索生物或规则" aria-label="搜索生物或规则"></label><div id="rule-list" class="rule-list"></div><button id="default-rule" class="default-button"><span>默认规则</span><span>→</span></button><div class="source-note"><span class="connection-dot"></span><div><b>统一掉落表</b><small>自动写回源码，下次编译时使用</small></div></div></aside>
<main class="editor"><section class="editor-heading"><div><div class="eyebrow" id="rule-type">生物掉落规则</div><h1 id="rule-title">正在载入</h1><div id="rule-id" class="mono"></div></div><div class="heading-actions"><button id="copy-rule" class="quiet" title="复制当前规则JSON">复制 JSON</button><button id="delete-rule" class="icon-button" title="删除当前规则" aria-label="删除当前规则">⌫</button></div></section><section id="creature-preview" class="creature-preview"></section><section class="policy-section"><div class="section-title"><h2>掉落方式</h2><span id="drop-count" class="muted"></span></div><div id="modes" class="mode-grid"></div><p id="mode-help" class="help"></p></section><section id="conditions" class="conditions"></section><section id="native-loot" class="native-loot"></section><section class="drops-section"><div class="section-title"><h2>配置物品</h2><button id="add-item-focus" class="text-button">从物品库添加 ↗</button></div><div id="drops"></div></section><div id="editor-error" class="error-box" hidden></div><footer class="editor-footer"><span>每项物品独立判定概率，可同时掉落。</span><span id="revision" class="mono"></span></footer></main>
<aside class="library"><div class="library-heading"><div class="eyebrow">物品库</div><h2>选择掉落物品</h2><p>点击物品即可加入当前规则</p></div><label class="search library-search"><span>⌕</span><input id="item-search" placeholder="搜索中文名或物品 ID" aria-label="搜索物品"></label><label class="category-select"><span>物品分类</span><select id="item-category" aria-label="物品分类"><option value="all">全部分类</option></select></label><div id="category-shortcuts" class="category-shortcuts"><button data-category="materials">材料</button><button data-category="pills">丹药</button><button data-category="weapons">武器</button></div><div class="namespace-filters" id="namespace-filters"><button data-ns="all" class="active">全部 <span id="all-count"></span></button><button data-ns="minecraft">原版 <span id="vanilla-count"></span></button><button data-ns="yuanxian">源仙 <span id="mod-count"></span></button></div><div class="library-meta"><span id="item-result-count"></span><span>1.21.1</span></div><div id="items" class="item-grid"></div><button id="more-items" class="quiet full" hidden>加载更多物品</button><div class="library-bottom">物品 ID 与中文名来自当前游戏资源</div></aside></div>
<div id="toast" role="status" hidden></div><dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="关闭弹窗">×</button></div><div id="modal-body"></div></dialog><div id="loading-overlay" class="loading-overlay"><div class="loader"></div><p id="loading-text">正在载入物品与统一规则…</p><button id="retry-load" class="quiet" hidden>重新连接</button></div></body></html>

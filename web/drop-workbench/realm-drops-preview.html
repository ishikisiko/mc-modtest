<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>按境界生成掉落</title>
  <style>
    * { box-sizing: border-box; }
    body { color: var(--foreground, #20322b); font: 14px/1.65 var(--font-sans, system-ui), sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; }
    h1 { font-size: 21px; line-height: 1.35; margin: 0; }
    p { margin: 6px 0; opacity: .8; }
    label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    select { color: inherit; background: var(--card, #f0f5f1); border: 1px solid var(--border, #d2ded6); border-radius: 6px; padding: 6px 9px; font: inherit; }
    table { width: 100%; table-layout: fixed; border-spacing: 0; margin: 14px 0; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border, #d2ded6); }
    th { opacity: .8; font-size: 12px; font-weight: 500; }
    th:first-child { width: 14%; }
    th:nth-child(2) { width: 41%; }
    th:nth-child(3) { width: 15%; }
    td:first-child { white-space: nowrap; }
    small { display: block; opacity: .8; font-size: 11px; }
    .individual { opacity: 1; font-weight: 650; }
    .probability { font-variant-numeric: tabular-nums; }
    .track { display: block; height: 4px; margin-top: 5px; border-radius: 2px; background: var(--secondary, #e2eae3); }
    .track span { display: block; height: 100%; border-radius: inherit; background: var(--chart-1, #23764d); }
    details { border-top: 1px solid var(--border, #d2ded6); padding: 7px 0; }
    summary { cursor: pointer; }
    pre { overflow: auto; max-height: 240px; margin: 8px 0 0; background: var(--code-background, #edf3ef); padding: 12px; border-radius: var(--radius, 6px); font: 11px/1.55 var(--font-mono, monospace); }
    @media (max-width: 450px) {
      body { font-size: 12px; }
      h1 { font-size: 18px; }
      th, td { padding: 7px 4px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>按境界生成掉落</h1>
        <p>切换生物，查看生成的数量和基础概率。</p>
      </div>
      <label>生物 <select id="entity"></select></label>
    </header>
    <table aria-label="分境界掉落">
      <thead><tr><th scope="col">境界</th><th scope="col">掉落物</th><th scope="col">数量</th><th scope="col">基础概率</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="summary"></p>
    <details><summary>共用模板与单独配置</summary><pre id="input"></pre></details>
    <details><summary>生成的追加规则</summary><pre id="rules"></pre></details>
  </main>
  <script id="realm-drop-data" type="application/json">__REALM_DROP_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('realm-drop-data').textContent);
    const choices = document.getElementById('entity');
    const list = document.getElementById('rows');
    const entities = new Map(data.rows.map(row => [row.entity_id, row.entity]));
    const percentage = new Intl.NumberFormat('zh-CN', {style: 'percent', maximumFractionDigits: 3});
    for (const [id, name] of entities) choices.add(new Option(name, id));
    choices.disabled = !entities.size;
    document.getElementById('input').textContent = JSON.stringify(data.input, null, 2);
    document.getElementById('rules').textContent = JSON.stringify(data.additions, null, 2);
    const replacement = data.replaced.length ? `候选表将替换 ${data.replaced.join('、')}。` : '';
    document.getElementById('summary').textContent = `这次预览生成 ${data.additions.length} 条追加规则。${replacement}`;

    function showDrops() {
      list.replaceChildren();
      for (const row of data.rows) {
        if (row.entity_id !== choices.value) continue;
        const tr = list.insertRow();
        tr.insertCell().textContent = row.realm;
        const item = tr.insertCell();
        item.append(row.item);
        const source = document.createElement('small');
        source.textContent = row.source;
        if (row.source === '单独配置') source.className = 'individual';
        item.append(source);

        const {min, max, chance} = row.drop;
        tr.insertCell().textContent = min === max ? `${min} 个` : `${min}–${max} 个`;
        const probability = tr.insertCell();
        probability.className = 'probability';
        probability.textContent = percentage.format(chance);
        const track = document.createElement('span');
        track.className = 'track';
        track.setAttribute('aria-hidden', 'true');
        const fill = document.createElement('span');
        fill.style.width = percentage.format(chance);
        track.append(fill);
        probability.append(track);
      }
    }
    choices.addEventListener('change', showDrops);
    showDrops();
  </script>
</body>
</html>

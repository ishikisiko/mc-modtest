import org.gradle.internal.os.OperatingSystem

def pythonExecutable = providers.environmentVariable('PYTHON').orElse(
    OperatingSystem.current().isWindows() ? 'python' : 'python3'
)

// Generate the structure resources that are packed into the NeoForge mod jar.
tasks.register('generateAllStructures', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/generate_all_structures.py',
            '--mc-version', '1.21.1',
            '--output', 'src/main/resources/data/myvillage/structure'
}

tasks.register('generateRoadPorts', Exec) {
    dependsOn 'generateProvinceCapitalV11Assets'
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/gen_road_ports.py'
}
tasks.named('processResources') { dependsOn 'generateRoadPorts' }

tasks.named('processResources') {
    dependsOn 'generateAllStructures'
    from('guidebook') {
        into 'assets/myvillage/guides/myvillage/cultivation'
    }
    // Generation may change outputs between runs.
    outputs.upToDateWhen { false }
}

tasks.register('verifySwordQiDecorationAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/gen_sword_qi_decoration.py', '--check'
}
tasks.named('processResources') { dependsOn 'verifySwordQiDecorationAssets' }

tasks.register('verifyDemonPactPillarAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/demon_pact_pillar/generate.py', '--check'
}
tasks.named('processResources') { dependsOn 'verifyDemonPactPillarAssets' }

tasks.register('generateLordManorAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/lord_manors/generate.py'
    inputs.files(fileTree('blueprints/lord_manors'), fileTree('tools/lord_manors'))
    inputs.files('tools/json_to_nbt.py', 'tools/gen_alchemy_assets.py',
            'src/main/resources/data/myvillage/decoration/demon_pact_pillar.json')
    outputs.dir('src/main/resources/data/myvillage/structure/lord_manors')
    outputs.dir('src/main/resources/data/myvillage/lord_manors')
    outputs.dir('src/main/resources/assets/myvillage/textures/block/lord_manors')
    mustRunAfter 'generateAllStructures'
}
tasks.register('verifyLordManorAssets', Exec) {
    dependsOn 'generateLordManorAssets'
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/lord_manors/generate.py', '--check'
}
tasks.named('processResources') { dependsOn 'verifyLordManorAssets' }

// 原生树形由 Minecraft 自身的 ConfiguredFeature 生成；独立数据工具不进入模组。
sourceSets {
    manorTreegen {
        java.setSrcDirs(['tools/lord_manors/treegen'])
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}
configurations.manorTreegenCompileClasspath.extendsFrom(configurations.runtimeClasspath)
configurations.manorTreegenRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)
tasks.register('prepareManorNativeTreeSites', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args '-m', 'tools.lord_manors.native_trees', '--prepare', 'build/generated/lord_manor_tree_sites/sites.json'
}
tasks.register('generateManorNativeTrees', JavaExec) {
    dependsOn 'prepareManorNativeTreeSites', 'manorTreegenClasses'
    classpath = sourceSets.manorTreegen.runtimeClasspath
    mainClass = 'myvillage.tools.NativeTreeCapture'
    maxHeapSize = '3g'
    args 'build/generated/lord_manor_tree_sites/sites.json', 'tools/lord_manors/generated/native_trees.json',
            new File(gradle.gradleUserHomeDir, "caches/neoformruntime/artifacts/minecraft_${minecraft_version}_client.jar").absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Generated-resource ownership remains with authored worldplan and Yunshan inputs.
tasks.register('generateWorldPlanAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/worldplan/generate_assets.py'
    inputs.files(fileTree('blueprints/worldplan'), fileTree('blueprints/yunshan'),
            fileTree('src/main/resources/data/myvillage/worldgen/region_profile'),
            fileTree('tools/worldplan') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/yunshan') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('tools/json_to_nbt.py', 'tools/voxel_dump_to_structures.py'))
    outputs.dir(layout.buildDirectory.dir('generated/worldplan/resources'))
}
tasks.named('processResources') { dependsOn 'generateWorldPlanAssets' }

// Intermediate geometry inputs for the current capital exporter; not a runtime resource source.
tasks.register('generateProvinceCapitalAssets', Exec) {
    dependsOn 'generateWorldPlanAssets'
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/province_capitals/game/compile.py', '--out', 'build/generated/province_capitals/resources'
    inputs.files(fileTree('blueprints/province_capitals'), files('blueprints/worldplan/rules_v8.json'),
            fileTree('tools/province_capitals') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('web/yunshan-city') { include 'src/**', 'package.json', 'package-lock.json' },
            fileTree('tools/buildgen'),
            files('exmod/mod_block_catalog.json', 'tools/json_to_nbt.py', 'tools/voxel_dump_to_structures.py'),
            fileTree('build/generated/worldplan/resources'))
    outputs.dir(layout.buildDirectory.dir('generated/province_capitals/resources'))
}

// Regional authored geometry consumed by the current capital exporter.
tasks.register('generateProvinceCapitalV9Assets', Exec) {
    dependsOn 'generateProvinceCapitalAssets'
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/province_capitals/game/compile_v9.py',
            '--out', 'build/generated/province_capitals_v9/resources',
            '--legacy-out', 'build/generated/province_capitals/resources',
            '--skip-legacy-export'
    inputs.files(files('blueprints/worldplan/rules_v8.json', 'blueprints/worldplan/rules_v9.json'),
            fileTree('blueprints/province_capitals/regional/v2'),
            fileTree('tools/province_capitals') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('exmod/mod_block_catalog.json', 'tools/json_to_nbt.py', 'tools/voxel_dump_to_structures.py'),
            fileTree('build/generated/province_capitals/resources'))
    outputs.dir(layout.buildDirectory.dir('generated/province_capitals_v9/resources'))
}

// City environment generation input; only the final V11 resource tree is packaged.
tasks.register('generateProvinceCapitalV10Assets', Exec) {
    dependsOn 'generateProvinceCapitalV9Assets'
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/province_capitals/game/compile_v10.py', '--skip-base-export'
    inputs.files(files('blueprints/worldplan/rules_v10.json'),
            fileTree('blueprints/province_capitals/environment_v3'),
            fileTree('blueprints/province_capitals/environment_design'),
            fileTree('tools/province_capitals') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('exmod/mod_block_catalog.json', 'tools/json_to_nbt.py'),
            fileTree('build/generated/province_capitals/resources'),
            fileTree('build/generated/province_capitals_v9/resources'))
    outputs.dir(layout.buildDirectory.dir('generated/province_capitals_v10/resources'))
}

tasks.register('generateStreetFurnitureAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/street_furniture/generate.py'
    inputs.files(fileTree('blueprints/street_furniture'),
            files('src/main/resources/assets/myvillage/font/brush.ttf'),
            fileTree('tools/street_furniture') { exclude '**/__pycache__/**', '**/*.pyc' })
    outputs.files(fileTree('src/main/resources/assets/myvillage/models/block/street_furniture'),
            fileTree('src/main/resources/assets/myvillage/textures/block/street_furniture'),
            files('src/main/resources/data/myvillage/street_furniture/catalog.json'))
}
tasks.register('generateStarterMineAssets', Exec) {
    workingDir projectDir
    executable 'python3'
    args '-m', 'tools.starter_mine.generate'
    inputs.files(fileTree('blueprints/starter_mine'), fileTree('tools/starter_mine') { exclude '**/__pycache__/**', '**/*.pyc' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc' }, files('exmod/mod_block_catalog.json'))
    outputs.dir(layout.buildDirectory.dir('generated/starter_mine/resources'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/starter_mine/resources'))
tasks.named('processResources') { dependsOn 'generateStarterMineAssets' }

tasks.register('generateProvinceCapitalV11Assets', Exec) {
    dependsOn 'generateProvinceCapitalV10Assets', 'generateStreetFurnitureAssets', 'verifyLordManorAssets', 'generateSectBlueprintAssets', 'generateStarterMineAssets'
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/province_capitals/game/compile_v11.py', '--skip-base-export'
    inputs.files(files('tools/player_economy_sites.py','blueprints/economy/town_boards.json'))
    inputs.files(fileTree('blueprints/qianji'), fileTree('tools/qianji') { exclude '**/__pycache__/**', '**/*.pyc' })
    inputs.files(fileTree('blueprints/player_estates'), fileTree('tools/player_estates') { exclude '**/__pycache__/**', '**/*.pyc' })
    inputs.files(fileTree('build/generated/sect_blueprints/resources'), fileTree('build/generated/starter_mine/resources'), files('blueprints/worldplan/rules_v11.json'), fileTree('blueprints/street_furniture'),
            fileTree('blueprints/province_capitals/blueprint_plan'), fileTree('blueprints/lord_manors'),
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc' },
            fileTree('src/main/resources/data/myvillage/lord_manors'),
            fileTree('src/main/resources/data/myvillage/structure/lord_manors'),
            files('exmod/mod_block_catalog.json', 'src/main/resources/data/myvillage/decoration/demon_pact_pillar.json'),
            fileTree('tools/street_furniture') { exclude '**/__pycache__/**', '**/*.pyc' },
            fileTree('tools/province_capitals') { exclude '**/__pycache__/**', '**/*.pyc' },
            fileTree('build/generated/province_capitals_v10/resources'),
            fileTree('build/generated/province_capitals_v9/resources'),
            fileTree('build/generated/province_capitals/resources'))
    outputs.dir(layout.buildDirectory.dir('generated/province_capitals_v11/resources'))
    inputs.files(fileTree('blueprints/capital_waystones'),
            fileTree('tools/capital_waystones') { exclude '**/__pycache__/**', '**/*.pyc' })
    doLast {
        exec {
            workingDir projectDir
            executable pythonExecutable.get()
            args '-m', 'tools.capital_waystones.generate', '--resources', 'build/generated/province_capitals_v11/resources'
        }
        // 亭台模板和石碑元数据共同进入八城冻结摘要。
        exec {
            workingDir projectDir
            executable pythonExecutable.get()
            args 'tools/province_capitals/game/compile_v11.py', '--refresh-current'
        }
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/province_capitals_v11/resources'))
tasks.named('processResources') {
    dependsOn 'generateProvinceCapitalV11Assets'
    // Development builds ship only the current worldplan and capital resource set.
    // Remove earlier Copy-task outputs before copying current resources on an incremental build.
    doFirst {
        delete(new File(destinationDir, 'data/myvillage/capitals'),
                new File(destinationDir, 'data/myvillage/structure/province_capitals'),
                new File(destinationDir, 'data/myvillage/worldplan'),
                new File(destinationDir, 'data/myvillage/structure/worldplan'))
    }
}

// 当前宗门只打包已确认蓝图的编译清单和分块。
tasks.register('generateSectBlueprintAssets', Exec) {
    dependsOn 'generateAllStructures'
    workingDir projectDir
    commandLine 'python3', 'tools/sect_blueprints/runtime.py'
    inputs.files(fileTree('blueprints/sects'), fileTree('tools/sect_blueprints') { exclude '**/__pycache__/**', '**/*.pyc' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc' },
            fileTree('src/main/resources/data/myvillage/structure') { include 'sect_*.nbt','scripture_pavilion_*.nbt','disciple_quarters_*.nbt','alchemy_room_*.nbt','bell_drum_tower_*.nbt' },
            files('tools/province_capitals/regional/v2/common.py','tools/province_capitals/blueprint_plan/nbt_entities.py',
                    'tools/buildgen/styles/cultivation_sect.json','exmod/mod_block_catalog.json'))
    outputs.dir(layout.buildDirectory.dir('generated/sect_blueprints/resources'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/sect_blueprints/resources'))
tasks.named('processResources') {
    dependsOn 'generateSectBlueprintAssets'
    exclude 'data/myvillage/structure/cultivation_sect_*.nbt', 'data/myvillage/settlement_meta/cultivation_sect_*.json',
            'data/myvillage/function/place/cultivation_sect_*.mcfunction'
    doFirst {
        delete(new File(destinationDir,'data/myvillage/sect_blueprints'),new File(destinationDir,'data/myvillage/structure/sect_blueprints'))
        delete(fileTree(destinationDir) { include 'data/myvillage/structure/cultivation_sect_*.nbt', 'data/myvillage/settlement_meta/cultivation_sect_*.json', 'data/myvillage/function/place/cultivation_sect_*.mcfunction' })
    }
}


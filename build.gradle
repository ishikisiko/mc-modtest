// 生成器完成后校验实际语言源，打包完成后严格核对JAR字节。
def languageInputSnapshot = layout.buildDirectory.file('language-assets/before-generation.json')
tasks.register('captureLanguageAssets', Exec) {
    workingDir projectDir
    executable pythonExecutable.get()
    args 'tools/validate_language_assets.py', '--snapshot', languageInputSnapshot.get().asFile.absolutePath
    outputs.upToDateWhen { false }
}
// 单独运行生成器仍可更新其资源；正式打包时先固定两份共享语言输入。
tasks.withType(Exec).configureEach {
    if (name != 'captureLanguageAssets') mustRunAfter 'captureLanguageAssets'
}
tasks.named('processResources') {
    dependsOn 'captureLanguageAssets'
    doFirst {
        project.exec {
            workingDir projectDir
            executable pythonExecutable.get()
            args 'tools/validate_language_assets.py', '--baseline', languageInputSnapshot.get().asFile.absolutePath
        }
    }
}
tasks.named('jar') {
    inputs.files('tools/validate_language_assets.py', 'tools/language_assets.py')
    doLast {
        def languageJar = archiveFile.get().asFile.absolutePath
        project.exec {
            workingDir projectDir
            executable pythonExecutable.get()
            args 'tools/validate_language_assets.py', '--jar', languageJar
        }
    }
}

// npcgen owns both full authoring output and compact runtime packaging. Preserve old resource paths.
def packedNpcResources = layout.buildDirectory.dir('generated/npc_packed/resources')
tasks.register('packNpcResources', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args '-m', 'tools.npcgen.pack', '--output', packedNpcResources.get().asFile.absolutePath
    inputs.files('tools/npcgen/pack.py', 'tools/npcgen/packing.json',
            fileTree('src/main/resources/assets/myvillage/npc') {
                include '*_model.json', '*_animations.json'
            })
    outputs.dir(packedNpcResources)
}
tasks.named('processResources') {
    dependsOn 'packNpcResources'
    def authoredNpc = file('src/main/resources/assets/myvillage/npc').absolutePath + File.separator
    exclude { detail -> detail.file.absolutePath.startsWith(authoredNpc) &&
            (detail.name.endsWith('_model.json') || detail.name.endsWith('_animations.json')) }
    from(packedNpcResources)
}

// Isolated undead AI/restart evidence, excluded from deliverable jars.
if (providers.gradleProperty('undeadEvidence').isPresent()) {
    sourceSets.main.java.srcDir('src/undeadEvidence/java')
    neoForge.runs.named('acceptanceServer') {
        gameDirectory = project.file('run-undead-evidence')
        programArgument 'nogui'
    }
    tasks.named('jar') {
        doFirst { throw new GradleException('Undead evidence classes must not be packaged; build without -PundeadEvidence') }
    }
}

// Opt-in natural target acquisition; this source set must never enter the delivered jar.
if (providers.gradleProperty('cultivatorHostilityEvidence').isPresent()) {
    sourceSets.main.java.srcDir('src/hostilityEvidence/java')
    neoForge.runs.named('acceptanceServer') {
        gameDirectory = project.file('run-cultivator-hostility')
        programArgument 'nogui'
    }
    tasks.named('jar') {
        doFirst { throw new GradleException('Hostility evidence classes must not be packaged; build without -PcultivatorHostilityEvidence') }
    }
}

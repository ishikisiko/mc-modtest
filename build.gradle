plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

configurations {
    courtyardLocalRuntime { canBeConsumed = false; canBeResolved = false }
    runtimeClasspath.extendsFrom courtyardLocalRuntime
}

def palJarName = 'PlayerAnimationLibNeoforge-1.1.4+mc.1.21.1.jar'
def palJar = layout.projectDirectory.file(palJarName).asFile
if (!palJar.isFile()) {
    throw new GradleException(
            "Required Player Animation Library jar is missing: ${palJar.absolutePath}. " +
                    "Place ${palJarName} in the project root.")
}

dependencies {
    implementation files(palJar)

    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${courtyard_jei_version}"
    if (providers.gradleProperty('courtyard_jei_test').isPresent()) {
        courtyardLocalRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${courtyard_jei_version}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Runtime-backed tests load mapped Minecraft/NeoForge types directly.
configurations.testCompileClasspath.extendsFrom(configurations.runtimeClasspath)
configurations.testRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)

tasks.named('test') {
    useJUnitPlatform()
    // -PupdatePreviewParity: FirstPersonPreviewParityTest rewrites its golden fixture instead of checking it.
    if (providers.gradleProperty('updatePreviewParity').isPresent()) {
        systemProperty 'myvillage.updatePreviewParity', 'true'
    }
}

neoForge {
    version = project.neo_version
    // moddev-gradle 2.0.141 registers mod sources via a top-level `mods {}`
    // block (the older `runs { configureEach { modSource ... } }` DSL was
    // removed; RunModel has no modSource in this version).
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        configureEach {
            // all runs load the mod declared above
        }
        client {
            client()
            if (providers.gradleProperty('combat_smoke_game_dir').isPresent()) {
                gameDirectory = project.file(providers.gradleProperty('combat_smoke_game_dir').get())
            }
            if (providers.gradleProperty('combat_smoke_username').isPresent()) {
                programArgument '--username'
                programArgument providers.gradleProperty('combat_smoke_username').get()
            }
            if (providers.gradleProperty('combat_smoke_server').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument providers.gradleProperty('combat_smoke_server').get()
                programArgument '--width'
                programArgument '960'
                programArgument '--height'
                programArgument '540'
            } else if (providers.gradleProperty('pal_smoke_world').isPresent()) {
                programArgument '--quickPlaySingleplayer'
                programArgument providers.gradleProperty('pal_smoke_world').get()
                programArgument '--width'
                programArgument '960'
                programArgument '--height'
                programArgument '540'
            }
        }
        guide {
            client()
            systemProperty 'guideme.myvillage.cultivation.sources', file('guidebook').absolutePath
            systemProperty 'guideme.myvillage.cultivation.sourcesNamespace', 'myvillage'
            systemProperty 'guideme.showOnStartup', 'myvillage:cultivation'
            systemProperty 'guideme.validateAtStartup', 'myvillage:cultivation'
        }
        server {
            server()
        }
        acceptanceServer {
            server()
            gameDirectory = project.file('run-acceptance')
            ideName = 'Acceptance Server'
        }
    }
}

// Opt-in dedicated-server evidence; never compiled or packaged in the deliverable jar.
if (providers.gradleProperty('vanillaRealmEvidence').isPresent()) {
    sourceSets.main.java.srcDir('src/realmEvidence/java')
    tasks.named('jar') {
        doFirst { throw new GradleException('Evidence classes must not be packaged; build jar without -PvanillaRealmEvidence') }
    }
}

// Opt-in native NPC garden probe; the evidence subscriber is never part of a release jar.
if (providers.gradleProperty('npcGardenEvidence').isPresent()) {
    sourceSets.main.java.srcDir('src/gardenEvidence/java')
    tasks.named('jar') {
        doFirst { throw new GradleException('NPC garden evidence classes must not be packaged; build jar without -PnpcGardenEvidence') }
    }
}

import org.gradle.internal.os.OperatingSystem

def pythonExecutable = providers.environmentVariable('PYTHON').orElse(
    OperatingSystem.current().isWindows() ? 'python' : 'python3'
)

// Generate the structure resources that are packed into the NeoForge mod jar.
tasks.register('generateAllStructures', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/generate_all_structures.py',
            '--mc-version', '1.21.1',
            '--output', 'src/main/resources/data/myvillage/structure'
}

tasks.named('processResources') {
    dependsOn 'generateAllStructures'
    from('guidebook') {
        into 'assets/myvillage/guides/myvillage/cultivation'
    }
    // Generation may change outputs between runs.
    outputs.upToDateWhen { false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Generated-resource ownership remains with authored worldplan and Yunshan inputs.
tasks.register('generateWorldPlanAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/worldplan/generate_assets.py'
    inputs.files(fileTree('blueprints/worldplan'), fileTree('blueprints/yunshan'),
            fileTree('src/main/resources/data/myvillage/worldgen/region_profile'),
            fileTree('tools/worldplan') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/yunshan') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('tools/json_to_nbt.py', 'tools/voxel_dump_to_structures.py'))
    outputs.dir(layout.buildDirectory.dir('generated/worldplan/resources'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/worldplan/resources'))
tasks.named('processResources') { dependsOn 'generateWorldPlanAssets' }

// Versioned natural settlement resources; each overlay belongs to one chunk.
tasks.register('generateBayTerracesAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args '-m', 'tools.regiongen.bay_assets'
    inputs.files(fileTree('blueprints/regiongen'), fileTree('blueprints/yunshan'),
            fileTree('tools/regiongen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/yunshan') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('tools/json_to_nbt.py'))
    outputs.dir(layout.buildDirectory.dir('generated/regiongen/resources'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/regiongen/resources'))
tasks.named('processResources') { dependsOn 'generateBayTerracesAssets' }
tasks.named('generateWorldPlanAssets') {
    dependsOn 'generateBayTerracesAssets'
    inputs.files(fileTree('build/generated/regiongen/resources'), files('blueprints/regiongen/bay_terraces_v1_hashes.json'))
}

// Qianzhen is an explicit story scene; its authored templates never enter the shared cleanup tree.
tasks.register('generateQianzhenStoryAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/qianzhen/story_assets.py', '--opening', '--out', 'build/generated/qianzhen/resources'
    inputs.files(fileTree('blueprints/qianzhen'), fileTree('blueprints/qianzhen_opening'),
            fileTree('tools/qianzhen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('tools/json_to_nbt.py', 'tools/voxel_dump_to_structures.py'))
    outputs.dir(layout.buildDirectory.dir('generated/qianzhen/resources'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/qianzhen/resources'))
tasks.named('processResources') { dependsOn 'generateQianzhenStoryAssets' }

// The Chapter 1 building owner feeds the settlement adapter; story runtime remains independent.
tasks.register('generateQianzhenRegionAssets', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args '-m', 'tools.regiongen.qianzhen_assets'
    inputs.files(fileTree('blueprints/qianzhen'), files('blueprints/regiongen/qianzhen_region_v1.json'),
            fileTree('tools/qianzhen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('tools/regiongen/qianzhen_assets.py'),
            fileTree('tools/buildgen') { exclude '**/__pycache__/**', '**/*.pyc', '**/*.pyo' },
            files('tools/json_to_nbt.py'))
    outputs.dir(layout.buildDirectory.dir('generated/qianzhen_region/resources'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/qianzhen_region/resources'))
tasks.named('processResources') { dependsOn 'generateQianzhenRegionAssets' }
tasks.named('generateWorldPlanAssets') {
    dependsOn 'generateQianzhenRegionAssets'
    inputs.files(fileTree('build/generated/qianzhen_region/resources'))
}

// Metadata follows authored building adapters without modifying the frozen worldplan structures.
tasks.register('generateNpcLifePlaces', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/gen_npc_life_places.py'
    inputs.files(fileTree('blueprints/npc_life'), fileTree('blueprints/yunshan'), fileTree('blueprints/worldplan'),
            fileTree('tools/yunshan'), fileTree('tools/worldplan'), fileTree('tools/buildgen'),
            files('tools/gen_npc_life_places.py', 'tools/json_to_nbt.py', 'tools/voxel_dump_to_structures.py'))
    outputs.file('src/main/resources/data/myvillage/npc_life/places.json')
}
tasks.named('processResources') { dependsOn 'generateNpcLifePlaces' }

tasks.register('generateExplorationGuide', Exec) {
    workingDir = projectDir
    executable = pythonExecutable.get()
    args 'tools/gen_exploration_guide.py'
    inputs.files('tools/gen_exploration_guide.py', 'src/main/resources/data/myvillage/exploration/rules.json',
            'src/main/resources/data/myvillage/exploration/bosses.json',
            'src/main/resources/assets/myvillage/lang/zh_cn.json', 'src/main/resources/assets/myvillage/lang/en_us.json')
    outputs.files('guidebook/getting_started/exploration.md', 'guidebook/_en_us/getting_started/exploration.md')
    mustRunAfter 'generateAllStructures'
}
tasks.named('processResources') { dependsOn 'generateExplorationGuide' }

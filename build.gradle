plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeModule 'maven.modrinth', 'jade'
            includeModule 'maven.modrinth', 'waystones'
            includeModule 'maven.modrinth', 'balm'
        }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

configurations {
    courtyardLocalRuntime { canBeConsumed = false; canBeResolved = false }
    runtimeClasspath.extendsFrom courtyardLocalRuntime
}

def palJarName = 'PlayerAnimationLibNeoforge-1.1.4+mc.1.21.1.jar'
def palJar = layout.projectDirectory.file(palJarName).asFile
if (!palJar.isFile()) {
    throw new GradleException(
            "Required Player Animation Library jar is missing: ${palJar.absolutePath}. " +
                    "Place ${palJarName} in the project root.")
}

dependencies {
    implementation files(palJar)

    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${courtyard_jei_version}"
    compileOnly "maven.modrinth:jade:${manor_jade_version}"
    testImplementation "maven.modrinth:jade:${manor_jade_version}"
    compileOnly "maven.modrinth:waystones:${waystones_version}"
    compileOnly "maven.modrinth:balm:${waystones_balm_version}"
    testImplementation "maven.modrinth:waystones:${waystones_version}"
    testImplementation "maven.modrinth:balm:${waystones_balm_version}"
    if (providers.gradleProperty('waystones_test').isPresent()) {
        courtyardLocalRuntime "maven.modrinth:waystones:${waystones_version}"
        courtyardLocalRuntime "maven.modrinth:balm:${waystones_balm_version}"
    }
    if (providers.gradleProperty('manor_jade_test').isPresent()) {
        courtyardLocalRuntime "maven.modrinth:jade:${manor_jade_version}"
    }
    if (providers.gradleProperty('courtyard_jei_test').isPresent()) {
        courtyardLocalRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${courtyard_jei_version}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Runtime-backed tests load mapped Minecraft/NeoForge types directly.
configurations.testCompileClasspath.extendsFrom(configurations.runtimeClasspath)
configurations.testRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)

tasks.named('test') {
    useJUnitPlatform()
    // -PupdatePreviewParity: FirstPersonPreviewParityTest rewrites its golden fixture instead of checking it.
    if (providers.gradleProperty('updatePreviewParity').isPresent()) {
        systemProperty 'myvillage.updatePreviewParity', 'true'
    }
}

neoForge {
    version = project.neo_version
    // moddev-gradle 2.0.141 registers mod sources via a top-level `mods {}`
    // block (the older `runs { configureEach { modSource ... } }` DSL was
    // removed; RunModel has no modSource in this version).
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        configureEach {
            // all runs load the mod declared above
        }
        client {
            client()
            if (providers.gradleProperty('combat_smoke_game_dir').isPresent()) {
                gameDirectory = project.file(providers.gradleProperty('combat_smoke_game_dir').get())
            }
            if (providers.gradleProperty('combat_smoke_username').isPresent()) {
                programArgument '--username'
                programArgument providers.gradleProperty('combat_smoke_username').get()
            }
            if (providers.gradleProperty('combat_smoke_server').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument providers.gradleProperty('combat_smoke_server').get()
                programArgument '--width'
                programArgument '960'
                programArgument '--height'
                programArgument '540'
            } else if (providers.gradleProperty('pal_smoke_world').isPresent()) {
                programArgument '--quickPlaySingleplayer'
                programArgument providers.gradleProperty('pal_smoke_world').get()
                programArgument '--width'
                programArgument '960'
                programArgument '--height'
                programArgument '540'
            }
        }
        guide {
            client()
            systemProperty 'guideme.myvillage.cultivation.sources', file('guidebook').absolutePath
            systemProperty 'guideme.myvillage.cultivation.sourcesNamespace', 'myvillage'
            systemProperty 'guideme.showOnStartup', 'myvillage:cultivation'
            systemProperty 'guideme.validateAtStartup', 'myvillage:cultivation'
        }
        server {
            server()
        }
        acceptanceServer {
            server()
            gameDirectory = project.file('run-acceptance')
            ideName = 'Acceptance Server'
        }
    }
}

// 炼丹／炼器随机品质、实际工位和重启探针，禁止进入交付包。
if (providers.gradleProperty('estateEvidence').isPresent()) {
    sourceSets.main.java.srcDir('src/estateEvidence/java')

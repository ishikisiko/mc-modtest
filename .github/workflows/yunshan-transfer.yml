name: Yunshan isolated source transfer
on:
  push:
    branches: [feat/yunshan-living-city-worldplan-v4-20261018]
    paths: [.github/workflows/yunshan-transfer.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source and exact revision
        run: |
          git bundle create /tmp/yunshan-source.bundle HEAD
          git rev-parse HEAD > /tmp/source-revision.txt
          sha256sum /tmp/yunshan-source.bundle > /tmp/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yunshan-source
          path: |
            /tmp/yunshan-source.bundle
            /tmp/source-revision.txt
            /tmp/source-sha256.txt
          retention-days: 3

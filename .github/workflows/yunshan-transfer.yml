name: Yunshan isolated source transfer
on:
  push:
    branches: [feat/yunshan-living-city-worldplan-v4-20261018]
    paths: [.github/workflows/yunshan-transfer.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export fixed sources and pure Java test dependencies
        run: |
          mkdir /tmp/yunshan
          git bundle create /tmp/yunshan/yunshan-source.bundle HEAD
          git rev-parse HEAD > /tmp/yunshan/source-revision.txt
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar -o /tmp/yunshan/gson.jar
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar -o /tmp/yunshan/junit.jar
          cd /tmp/yunshan && sha256sum *.jar *.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: yunshan-java-source
          path: /tmp/yunshan/*
          retention-days: 3

name: Yunshan focused compilation
on:
  push:
    branches: [feat/yunshan-living-city-worldplan-v4-20261018]
    paths: [.github/workflows/yunshan-transfer.yml]
permissions:
  contents: read
concurrency:
  group: yunshan-v4-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/yunshan-living-city-worldplan-v4-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Exact PAL dependency
        run: |
          mkdir -p reports/yunshan-build
          git rev-parse HEAD > reports/yunshan-build/source-commit.txt
          curl -fL --retry 3 'https://mediafilez.forgecdn.net/files/7611/367/PlayerAnimationLibNeoforge-1.1.4%2Bmc.1.21.1.jar' -o 'PlayerAnimationLibNeoforge-1.1.4+mc.1.21.1.jar'
          echo 'b0836ad98db1e614f1e62cb40d5943eb4ba7d51f298e4b3ad0746770364ab072  PlayerAnimationLibNeoforge-1.1.4+mc.1.21.1.jar' | sha256sum -c -
          chmod +x gradlew
      - name: Scoped tests and jar
        run: |
          set -o pipefail
          python3 -m unittest tools.tests.test_yunshan_v4 tools.tests.test_npc_life_places 2>&1 | tee reports/yunshan-build/python.log
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -x generateAllStructures test --tests 'com.example.myvillage.sim.WorldSimCommerceTest' --tests 'com.example.myvillage.sim.runtime.commerce.*' --tests 'com.example.myvillage.worldplan.WorldPlanV4Test' --tests 'com.example.myvillage.worldplan.WorldPlanTest' jar 2>&1 | tee reports/yunshan-build/gradle.log
          python3 tools/worldplan/check_v4.py | tee reports/yunshan-build/v4-resources.json
          python3 tools/gen_npc_life_places.py --check
          sha256sum build/libs/*.jar > reports/yunshan-build/jar-sha256.txt
      - name: Preserve exact sources and evidence
        if: always()
        run: |
          mkdir -p reports/yunshan-build
          git bundle create reports/yunshan-build/source.bundle HEAD
          cp -r build/test-results reports/yunshan-build/ 2>/dev/null || true
          cp -r build/libs reports/yunshan-build/ 2>/dev/null || true
          cp build/worldplan/asset-report.json reports/yunshan-build/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunshan-v4-build-${{ github.run_number }}
          path: reports/yunshan-build/
          retention-days: 7

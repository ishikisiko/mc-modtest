name: Build DevBridge
on:
  push:
    branches: [build/devbridge-work-20260924]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build mod
        run: gradle --project-dir devbridge build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: devbridge-jar
          path: devbridge/build/libs/devbridge-0.5.3.jar
          if-no-files-found: error

name: Advanced arts branch integration
on:
  push:
    branches: [feat/advanced-weapon-arts-20261017]
    paths: [.github/workflows/advanced-arts-source.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct and apply verified local patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/advanced-weapon-arts-20261017"
          git merge-base --is-ancestor 055cee03991c1406e5b85d9942d336072f3642cc HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          blobs = [
              'f46d887cbc8c04bc24bbc093fa6ffaa69ac36384',
              'f234c240faaed8831af11298b46556520ec2b3bd',
              '5d9f2743dae4a29f0ff63e2ad7b49e8e4f9e513d',
              'cd6665224bec3a57b9fb4411ce6da5613e0a12fa',
          ]
          pieces = []
          for sha in blobs:
              doc = json.loads(subprocess.check_output(['gh', 'api', 'repos/ishikisiko/mc-modtest/git/blobs/' + sha]))
              assert doc['encoding'] == 'base64'
              data = base64.b64decode(doc['content'])
              assert len(data) == 7891
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              pieces.append(data)
          patch = lzma.decompress(b''.join(pieces))
          assert len(patch) == 152706
          assert hashlib.sha256(patch).hexdigest() == '52fd8422763d537bdd51487e975be095f8b85fb6f2316832f230f09e69667d34'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'advanced-arts.patch').write_bytes(patch)
          print('Verified local patch: 152706 bytes, SHA256 matches')
          PY
          git apply --unidiff-zero --check "$RUNNER_TEMP/advanced-arts.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/advanced-arts.patch"
      - name: Focused lightweight verification (not a Minecraft build)
        run: |
          python3 tools/gen_advanced_arts.py --check
          python3 tools/gen_technique_catalogue.py --check
          python3 tools/check_advanced_arts.py
          python3 -m unittest tools.tests.test_advanced_arts tools.tests.test_combat_data tools.tests.test_gen_technique_catalogue tools.tests.test_modal_runner
          git diff --cached --check
      - name: Commit and push feature branch only
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/advanced-weapon-arts-20261017"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add six book-learned advanced weapon arts with authoritative choreography and VFX"
          git push origin HEAD:refs/heads/feat/advanced-weapon-arts-20261017
          git bundle create "$RUNNER_TEMP/advanced-arts-feature.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/advanced-arts-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-arts-feature-source
          path: |
            ${{ runner.temp }}/advanced-arts-feature.bundle
            ${{ runner.temp }}/advanced-arts-head.txt
          retention-days: 1

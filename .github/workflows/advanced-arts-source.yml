name: Advanced arts source bundle
on:
  push:
    branches: [feat/advanced-weapon-arts-20261017]
    paths: [.github/workflows/advanced-arts-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export Git objects only (no checkout credentials or runner environment)
        run: git bundle create "$RUNNER_TEMP/mc-modtest.bundle" --all
      - uses: actions/upload-artifact@v4
        with:
          name: mc-modtest-source-bundle
          path: ${{ runner.temp }}/mc-modtest.bundle
          retention-days: 1

name: Worldplan cloud acceptance
on:
  push:
    branches: [feature/seeded-worldplan-20261017]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldplan-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate checked development-clone edits once
        run: |
          if test -f tools/worldplan/apply_integration.py; then
            python3 tools/worldplan/apply_integration.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'feat(worldplan): integrate frozen geography with generation, region queries and ecology'
            git push origin HEAD:feature/seeded-worldplan-20261017
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact PAL dependency
        run: |
          curl -fL --retry 3 'https://mediafilez.forgecdn.net/files/7611/367/PlayerAnimationLibNeoforge-1.1.4%2Bmc.1.21.1.jar' -o 'PlayerAnimationLibNeoforge-1.1.4+mc.1.21.1.jar'
          echo 'b0836ad98db1e614f1e62cb40d5943eb4ba7d51f298e4b3ad0746770364ab072  PlayerAnimationLibNeoforge-1.1.4+mc.1.21.1.jar' | sha256sum -c -
          chmod +x gradlew
      - name: Focused checks
        run: python3 tools/worldplan/ci.py
      - name: Export exact source and logs
        if: always()
        run: |
          mkdir -p reports/worldplan
          git rev-parse HEAD > reports/worldplan/source-commit.txt
          git bundle create reports/worldplan/source.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldplan-delivery-${{ github.run_number }}
          path: |
            reports/worldplan/
            build/libs/*.jar
            build/test-results/
            build/reports/tests/
            out/preview/worldplan/
          retention-days: 7

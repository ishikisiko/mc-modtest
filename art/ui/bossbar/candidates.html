<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雷角山君 · 血条样式候选</title>
<style>
*{box-sizing:border-box}body{background:#161b18;margin:0;color:var(--foreground,#e9e6dd);font-family:var(--font-sans,system-ui)}p{margin:6px 0 12px;font-size:13px;line-height:1.6;color:var(--muted-foreground,#aaa)}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px;font-size:13px}.controls label{display:flex;align-items:center;gap:6px}button{background:var(--secondary,#28302d);color:inherit;border:1px solid var(--border,#56635b);border-radius:6px;padding:7px 11px;cursor:pointer}input{accent-color:#a74335}input[type=range]{width:110px}h3{font-size:16px;margin:0;font-weight:600}h3 span{font-size:11px;font-weight:400;border:1px solid #8b7860;border-radius:4px;padding:2px 5px;margin-left:8px}.scene{position:relative;aspect-ratio:16/7;overflow:hidden;border-radius:var(--radius,10px);padding:16px;background:#81929b}.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}.scene:after{content:"历史实机背景 · 血条为设计叠加";position:absolute;bottom:12px;right:14px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000}.hud{position:absolute;left:0;top:0;width:100%;height:auto;filter:drop-shadow(0 2px 2px #0009)}article{margin-bottom:22px}svg text{font-family:"Noto Serif CJK SC","Source Han Serif SC","SimSun",serif}svg .name{font-size:24px;letter-spacing:5px}.fill{transition:width .22s ease-out}.trail{transition:width .7s .28s ease-out}.phase,.horn{font-size:12px;letter-spacing:2px}.enraged .phase{fill:#f6b7a2}.enraged .stamp{fill:#a63328}.broken .horn{fill:#ecbc84}article:nth-child(2) .enraged .phase{fill:#913b2e}article:nth-child(2) .broken .horn{fill:#805021}.foot{padding-top:6px;border-top:1px solid var(--border,#444);font-size:12px} @media(max-width:450px){.scene{aspect-ratio:16/9}.hud{width:118%;left:-9%}p{font-size:12px}.controls{gap:8px}}
</style>
<div class="controls"><label>气血 <input id="hp" aria-label="气血比例" type="range" min="0" max="100" value="72"><output id="value">72%</output></label><button id="hit">演示受伤</button><label><input id="phase" type="checkbox">二阶段</label><label><input id="horn" type="checkbox">已断角</label></div>
<div id="cards"></div>
<p class="foot">交互仅演示视觉：血量、二阶段、断角可独立切换；不代表游戏中的触发阈值。三款均拟置于屏幕顶部中央。选定后再接入现有服务器血条与状态同步。</p>
<script>
const bg="reference.png";
const defs='<defs><linearGradient id="shade" x2="0" y2="1"><stop stop-color="#07100f" stop-opacity=".65"/><stop offset="1" stop-color="#07100f" stop-opacity="0"/></linearGradient><linearGradient id="red"><stop stop-color="#6f2824"/><stop offset=".7" stop-color="#ae4938"/><stop offset="1" stop-color="#ce7454"/></linearGradient><linearGradient id="jade"><stop stop-color="#315653"/><stop offset=".8" stop-color="#6da8a0"/><stop offset="1" stop-color="#b0d6c8"/></linearGradient><filter id="rag"><feTurbulence type="fractalNoise" baseFrequency=".09 .4" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.7"/></filter></defs>';
const common='<rect width="960" height="150" fill="url(#shade)"/>';
function states(y,color){return '<text class="phase" x="466" y="'+y+'" text-anchor="end" fill="'+color+'">一阶段</text><text x="480" y="'+y+'" text-anchor="middle" fill="'+color+'" font-size="10">·</text><text class="horn" x="494" y="'+y+'" fill="'+color+'">雷角完整</text>'}
const styles=[
{title:'A · 朱砂横锋',tag:'推荐',desc:'一笔朱砂作气血，枯墨收锋，姓名旁点一枚小印。轮廓最轻，适合常驻战斗。',svg:common+
'<path d="M180 68L208 61 735 62 786 70 755 77 204 79 169 74 188 70Z" fill="#1c2726" opacity=".95" filter="url(#rag)"/><path d="M198 62L750 62M204 80L755 78" stroke="#e9dfbd" stroke-opacity=".7" fill="none"/><svg x="209" y="66" width="542" height="9"><rect width="100%" height="9" fill="#403b34"/><rect class="trail" width="72%" height="9" fill="#caa771"/><rect class="fill" width="72%" height="9" fill="url(#red)"/></svg><path d="M173 69L205 67M754 69L786 70M185 80L230 81" stroke="#e9dfbd" stroke-opacity=".55"/><text class="name" x="480" y="45" text-anchor="middle" fill="#f5edda">雷角山君</text><rect class="stamp" x="562" y="25" width="25" height="25" fill="#813b31"/><text x="574" y="42" fill="#f6e3c5" text-anchor="middle" font-size="16">煞</text><text x="207" y="99" fill="#e8dfcc" font-size="12" letter-spacing="2">筑基初期</text><text class="percent" x="750" y="99" text-anchor="end" fill="#f2e5d2" font-size="12">72%</text>'+states(99,'#e8dfcc')},
{title:'B · 宣纸古卷',tag:'古意最浓',desc:'窄宣纸托底，墨色行血，两端卷轴收口。昼夜都易辨认，但遮挡比 A 多。',svg:common+
'<path d="M193 24L249 22 341 24 469 22 591 24 704 22 769 24 769 105 697 108 551 105 429 108 301 106 193 108Z" fill="#e6dbc0" filter="url(#rag)"/><path d="M208 29L754 29M208 100L754 100" stroke="#a69572" stroke-width=".7"/><path d="M219 86L238 75 254 84 279 65 306 88 326 78 350 96H212Z" fill="#7b8575" opacity=".19"/><path d="M610 97L641 77 666 88 688 62 716 87 738 80 755 98Z" fill="#7b8575" opacity=".19"/><rect x="185" y="20" width="11" height="92" rx="3" fill="#463f30"/><rect x="766" y="20" width="11" height="92" rx="3" fill="#463f30"/><path d="M188 24V108M769 24V108" stroke="#bba476" stroke-width="2"/><text class="name" x="480" y="49" text-anchor="middle" fill="#2d332d">雷角山君</text><text x="221" y="48" fill="#67644e" font-size="12">筑基初期</text><rect class="stamp" x="714" y="34" width="25" height="24" fill="#914f3b"/><text x="727" y="51" fill="#efe0bc" text-anchor="middle" font-size="15">镇</text><svg x="220" y="62" width="520" height="11"><rect width="100%" height="11" fill="#b8ae95"/><rect class="trail" width="72%" height="11" fill="#b28660"/><rect class="fill" width="72%" height="11" fill="#303d36"/></svg><path d="M220 60H740M220 76H740" stroke="#76694e" stroke-width=".7"/><text class="percent" x="738" y="93" text-anchor="end" fill="#4b4c3f" font-size="12">72%</text>'+states(94,'#5e5949')},
{title:'C · 玄墨雷纹',tag:'山君专属感',desc:'玄墨云气托底，青玉气血，雷纹与角印呼应山君。压迫感更强，装饰也更重。',svg:common+
'<path d="M170 57Q208 43 253 50L280 30 327 40 407 31 480 21 554 32 630 39 680 30 710 49Q759 43 790 57L766 71 784 88 729 91 696 111 606 104 480 115 353 104 265 111 230 91 179 88 198 70Z" fill="#111f20" opacity=".94" filter="url(#rag)"/><path d="M212 69L234 56 274 56M748 69L726 56 686 56M230 87L251 98 292 98M730 87L709 98 668 98" fill="none" stroke="#9b9477" stroke-width="1"/><path d="M200 71L217 65 213 76 229 70M760 71L743 65 747 76 731 70" stroke="#a2c1ae" fill="none" stroke-width="2"/><text class="name" x="480" y="49" text-anchor="middle" fill="#e8e6ce">雷角山君</text><svg x="253" y="65" width="454" height="10"><rect width="100%" height="10" fill="#35403b"/><rect class="trail" width="72%" height="10" fill="#c8b57d"/><rect class="fill" width="72%" height="10" fill="url(#jade)"/></svg><path d="M250 62H710M250 79H710" stroke="#a49c75" stroke-width=".8"/><text x="253" y="96" fill="#bdc8b3" font-size="12">筑基初期</text><text class="percent" x="708" y="96" text-anchor="end" fill="#e0e3cd" font-size="12">72%</text>'+states(96,'#bdc8b3')}
];
document.getElementById('cards').innerHTML=styles.map(s=>'<article><h3>'+s.title+'<span>'+s.tag+'</span></h3><p>'+s.desc+'</p><div class="scene"><img src="'+bg+'" alt="雷角山君历史实机参考"><svg class="hud" viewBox="0 0 960 150" aria-label="'+s.title+'顶部血条">'+defs+s.svg+'</svg></div></article>').join('');
// Prefix SVG definition IDs so all three candidates remain independently renderable.
document.querySelectorAll('.hud').forEach((svg,i)=>{svg.innerHTML=svg.innerHTML.replace(/id="([^"]+)"/g,'id="s'+i+'-$1"').replace(/url\(#([^)]+)\)/g,'url(#s'+i+'-$1)')});
const hp=document.getElementById('hp'), phase=document.getElementById('phase'),horn=document.getElementById('horn');
function update(){document.getElementById('value').textContent=hp.value+'%';document.querySelectorAll('.fill,.trail').forEach(e=>e.setAttribute('width',hp.value+'%'));document.querySelectorAll('.percent').forEach(e=>e.textContent=hp.value+'%');document.querySelectorAll('.scene').forEach(e=>{e.classList.toggle('enraged',phase.checked);e.classList.toggle('broken',horn.checked)});document.querySelectorAll('.phase').forEach(e=>e.textContent=phase.checked?'二阶段 · 狂怒':'一阶段');document.querySelectorAll('.horn').forEach(e=>e.textContent=horn.checked?'雷角已断':'雷角完整')}
hp.oninput=update;phase.onchange=update;horn.onchange=update;document.getElementById('hit').onclick=()=>{hp.value=Math.max(0,Number(hp.value)-17);update()};
console.log('3 candidate HUDs; health range 0–100; independent phase and horn preview controls.');update();
</script></html>

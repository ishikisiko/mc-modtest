h:0;position:relative}.stage{width:100%;height:590px;position:relative;overflow:hidden;border-radius:var(--radius);background:#252b2d;touch-action:none}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.stage-note{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;color:#a7b3b7;font:10px/1.8 var(--font-mono);letter-spacing:.08em}.stage-bottom{position:absolute;left:18px;bottom:16px;right:18px;pointer-events:none;color:#bac0bf;font-size:11px;display:flex;justify-content:space-between}.controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.controls button{font-size:12px;padding:7px 10px}.views{display:flex;gap:6px;margin:10px 0 18px}.views button{font-size:12px;padding:6px 11px}.view-spacer{flex:1}.design-index{font:11px var(--font-mono);color:var(--primary);letter-spacing:.16em;margin:1px 0 11px}.tagline{font-size:15px;color:var(--primary);margin:9px 0 15px}.lede{font-size:13px;color:var(--foreground)}.rule{border-top:1px solid var(--border);margin-top:20px;padding-top:18px}.note-section{margin:18px 0}.note-section p{font-size:12px;color:var(--muted);margin:6px 0}.palette{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{display:flex;align-items:center;gap:6px;font:10px var(--font-mono);color:var(--muted)}.swatch{width:19px;height:19px;border-radius:50%;border:1px solid #ffffff1c;flex-shrink:0}.material-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin:16px 0}.material{display:flex;gap:9px;align-items:center;min-width:0}.material .swatch{width:28px;height:28px;box-shadow:inset 2px 3px 5px #ffffff1a,inset -2px -3px 5px #00000050}.material b{font-size:11px;font-weight:500;display:block;word-break:break-all}.material small{font:9px/1.6 var(--font-mono);display:block;margin-top:3px}.part-list{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;margin:20px 0}.part{padding-top:14px;border-top:1px solid var(--border)}.part button{font-size:11px;padding:4px 7px;float:right;margin-left:8px}.part p{font-size:12px;color:var(--muted)}.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:35px;margin-bottom:18px}.section-heading small{font-size:11px}.matrix{display:grid;gap:18px}.matrix-row{display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr));gap:12px}.realm-label{padding-top:25px;color:var(--muted);font-size:12px;line-height:1.8;writing-mode:vertical-rl;letter-spacing:.3em}.realm-label span{color:var(--primary);margin-bottom:8px;font:10px var(--font-mono);writing-mode:horizontal-tb;letter-spacing:0}.tile{border:1px solid transparent;border-radius:var(--radius);padding:0;overflow:hidden;text-align:left;position:relative;min-width:0}.tile[aria-pressed=true]{background:transparent;border-color:var(--primary)}.tile img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;background:#252b2d}.tile figure{padding:11px 12px 12px;margin:0}.tile b{font-weight:500;font-size:13px;display:block;letter-spacing:.05em}.tile small{font-size:10px;display:block;margin-top:4px;line-height:1.5}.thumb-pending{aspect-ratio:4/5;display:grid;place-items:center;background:#252b2d;color:#a7b3b7;font-size:10px;letter-spacing:.1em}.tile .number{position:absolute;top:10px;left:10px;font:9px var(--font-mono);color:#bac0bf;pointer-events:none}.footer{margin:30px 0 16px;padding-top:15px;border-top:1px solid var(--border);font-size:11px;line-height:1.8;color:var(--muted)}.error{border:1px solid var(--destructive);padding:16px;color:var(--destructive);white-space:pre-wrap;font:12px/1.7 var(--font-mono)}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#bec9cb;font-size:13px}details{margin-top:18px}summary{font-size:12px;color:var(--primary);cursor:pointer}#diagnostics{font:10px/1.8 var(--font-mono);color:var(--muted);white-space:pre-wrap;margin-top:9px}.matrix-toolbar{display:flex;gap:7px;align-items:center}.matrix-toolbar button{font-size:11px;padding:5px 8px}
@media(max-width:900px){.workspace{grid-template-columns:minmax(0,1fr)}.stage{height:540px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:0 25px}.notes .summary-block{grid-column:1/-1}.notes .rule{margin:10px 0 0}.notes .materials-block{margin-top:10px}.intro{margin-bottom:20px}}
@media(max-width:500px){.stage{height:470px}.realms{gap:5px}.realms button{min-width:0;padding:9px 6px}.realms b{font-size:14px}.realms span{font-size:8px}.styles button{font-size:12px}.notes{display:block}.part-list{grid-template-columns:1fr}.matrix-row{grid-template-columns:23px repeat(3,minmax(0,1fr));gap:5px}.realm-label{font-size:11px;padding-top:10px}.tile figure{padding:8px 5px}.tile b{font-size:11px}.tile small{font-size:9px}.tile .number{left:5px;top:6px;font-size:8px}.section-heading{align-items:start;flex-wrap:wrap}.section-heading h2{font-size:21px}.intro p{font-size:12px}.topline{font-size:10px}.stage-note{left:12px;right:12px}.controls{gap:5px}.controls button{padding:7px 8px}.views button{padding:6px 9px}}

<body>
<main id="atlas">
  <div class="topline"><span class="eyebrow">五境衣甲 · 立体设计档案</span><span class="muted smallcaps">15 套 · 60 件 · 15 种锭材</span></div>
  <p class="intro muted">选择境界与样式，旋转查看完整衣甲和配套灵材。每套均附材质谱与详细设计说明。</p>
  <nav class="realms" id="realms" aria-label="选择境界"></nav>
  <nav class="styles" id="styles" aria-label="本境三款"></nav>
  <div class="workspace">
    <section class="stage-wrap" aria-label="三维设计视窗">
      <div class="stage" id="stage"><div class="loading" id="loading">正在构建立体衣甲…</div><div class="stage-note"><span id="stage-label"></span><span>统一摄影棚<br>真实几何 / 连续曲面</span></div><div class="stage-bottom"><span>拖动旋转 · 滚轮 / 双指缩放</span><span id="view-label">整套穿戴</span></div></div>
      <div class="controls" id="modes" aria-label="选择观看内容"></div>
      <div class="views" id="views" aria-label="摄影机视角"><button data-angle="front">正面</button><button data-angle="side">侧面</button><button data-angle="back">背面</button><button data-angle="three" aria-pressed="true">四分之三</button><span class="view-spacer"></span><button id="auto" aria-pressed="false">缓慢转台</button><button id="reset">复位</button></div>
      <details><summary>几何信息与模型下载</summary><div id="diagnostics"></div><div class="controls"><button id="download-obj">导出当前几何 OBJ</button><button id="download-json">下载本套设计 JSON</button></div></details>
    </section>
    <aside class="notes" aria-label="中文设计解读">
      <div class="summary-block"><div class="design-index" id="design-index"></div><h2 id="design-name"></h2><p class="tagline" id="tagline"></p><p class="lede" id="description"></p></div>
      <details class="rule"><summary>轮廓、层次与境界进阶</summary><div class="note-section"><h4>轮廓与负空间</h4><p id="silhouette"></p></div><div class="note-section"><h4>本境的跃迁</h4><p id="progression"></p></div><div class="note-section"><h4>层次的组织</h4><p id="segmentation"></p></div></details>
      <div class="rule materials-block"><h4>材料谱</h4><div class="palette" id="palette"></div><div class="material-list" id="materials"></div><details class="note-section"><summary id="ingot-name"></summary><p id="material-story"></p><p id="ingot-description"></p></details></div>
    </aside>
  </div>
  <details><summary>四件防具 · 完整设计说明</summary><section class="part-list" id="parts"></section></details>
  <div class="section-heading"><h2>五境十五式</h2><div class="matrix-toolbar"><small id="thumb-status">逐套渲染真实模型</small><button id="show-all" aria-pressed="true">完整矩阵</button><button id="show-realm" aria-pressed="false">仅看本境</button></div></div>
  <section class="matrix" id="matrix" aria-label="十五套真实模型矩阵"></section>
  <div class="footer">概念设计册 · 人体与衣甲均为完整三维几何，可旋转观察和导出。所有款式使用同一棚光；缩略图直接由对应模型渲染。此处展示设计与材料表达，尚未经用户审美验收，也不代表游戏内表现。</div>
</main>

<script id="catalogue" type="application/json">__CATALOGUE_JSON__</script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), T=globalThis.THREE, E=globalThis.ArmorEngine;
const catalogue=JSON.parse($('catalogue').textContent), realms=['炼气','筑基','金丹','元婴','化神'];
const modes={all:'整套穿戴',head:'头饰',chest:'胸衣',legs:'下装',boots:'靴履',ingot:'灵材锭'};
const state={index:0,mode:'all',level:1,theta:.38,phi:1.44,radius:3.6,auto:false,onlyRealm:false};
const cachedThumbs=globalThis.__ARMOR_THUMBNAILS__||{};
const stats={thumbnailCount:0,cachedThumbnailCount:0,maxLiveDesignGroups:0,liveDesignGroups:0,ready:false,errors:[]};
globalThis.__ARMOR_ATLAS__={state,stats,catalogue,selectDesign,setMode,getGeometryStats:()=>E.meshStats(root),getMemory:()=>({...renderer.info.memory})};
let renderer,scene,camera,root,environment,pmrem,resizeObserver,renderFrame=0,thumbnailTimer=0,disposed=false,contextLost=false;
let focus=new T.Vector3(0,1.05,0), idealRadius=3.6;
const stage=$('stage'), cards=[], thumbnailQueue=[];
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function button(text,handler){const b=el('button','',text);b.type='button';b.addEventListener('click',handler);return b;}
function mark(group,yes){group.setAttribute('aria-pressed',String(yes));}
function error(err){stats.errors.push(String(err.stack||err));console.error(err);if($('loading'))$('loading').remove();const n=el('pre','error',String(err.message||err));stage.append(n);}
function studio(){
  scene=new T.Scene();scene.background=new T.Color('#252b2d');scene.fog=new T.Fog('#252b2d',3.5,9);
  const hemi=new T.HemisphereLight(0xcddfee,0x34302b,.68);scene.add(hemi);
  const light=(color,power,pos,size)=>{const l=new T.DirectionalLight(color,power);l.position.set(...pos);l.castShadow=true;l.shadow.mapSize.set(size,size);l.shadow.camera.left=-1.6;l.shadow.camera.right=1.6;l.shadow.camera.top=2.7;l.shadow.camera.bottom=-.6;l.shadow.camera.near=.1;l.shadow.camera.far=9;l.shadow.bias=-.00025;l.shadow.normalBias=.008;l.shadow.radius=3;scene.add(l);return l;};
  light(0xffedda,3.1,[-2.2,4.2,3.4],2048);
  const fill=new T.DirectionalLight(0xc0dcf1,1.15);fill.position.set(2.6,2,1.6);scene.add(fill);
  const rim=new T.DirectionalLight(0xf5dfbb,2.1);rim.position.set(1.8,3.1,-2.5);scene.add(rim);
  // An actual indoor reflection environment: broad softboxes, side strips and a muted floor.
  // Environment exists only in this viewer; the Node geometry API never needs WebGL.
  const room=new T.Scene();room.background=new T.Color(.055,.065,.075);
  const wall=new T.Mesh(new T.BoxGeometry(10,8,10),new T.MeshBasicMaterial({color:0x30383f,side:T.BackSide}));room.add(wall);
  const soft=(w,h,pos,intensity)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(intensity,intensity*.96,intensity*.89),side:T.DoubleSide}));m.position.set(...pos);m.lookAt(0,1,0);room.add(m);};
  soft(2.8,4.5,[-3,2.5,2.7],6);soft(1.4,4.4,[3,2.2,1],3.5);soft(3.8,1.8,[0,4.5,-1],4);soft(.5,3,[-1.7,1,-3],2.6);
  pmrem=new T.PMREMGenerator(renderer);pmrem.compileCubemapShader();environment=pmrem.fromScene(room,.04,.1,30);scene.environment=environment.texture;
  E.dispose(room);pmrem.dispose();
  const floor=new T.Mesh(new T.CircleGeometry(30,96),new T.MeshStandardMaterial({color:new T.Color('#20272a').convertSRGBToLinear(),roughness:.87,metalness:.13}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);
  // Low exhibition plinth. The body, not the display furniture, defines the silhouette.
  const plinth=new T.Mesh(new T.CylinderGeometry(.61,.64,.035,96),new T.MeshStandardMaterial({color:new T.Color('#303b40').convertSRGBToLinear(),metalness:.42,roughness:.45}));plinth.position.y=-.025;plinth.receiveShadow=true;scene.add(plinth);
  camera=new T.PerspectiveCamera(34,1,.02,60);camera.position.set(1,1.5,3.4);
}
function init(){
  if(!catalogue.length)throw new Error('目录为空');catalogue.forEach(E.validateDesign);
  renderer=new T.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;
  renderer.physicallyCorrectLights=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.domElement.setAttribute('aria-label','可拖动和缩放的三维衣甲');renderer.domElement.tabIndex=0;stage.prepend(renderer.domElement);
  studio();setupNavigation();setupMatrix();setupPointer();
  resizeObserver=new ResizeObserver(resize);resizeObserver.observe(stage);resize();
  selectDesign(0);$('loading').remove();stats.ready=true;
  scheduleThumb();
  renderer.domElement.addEventListener('webglcontextlost',evt=>{evt.preventDefault();contextLost=true;stats.errors.push('WebGL 上下文丢失');});
  renderer.domElement.addEventListener('webglcontextrestored',()=>{location.reload();});
  window.addEventListener('pagehide',cleanup,{once:true});
}
function setupNavigation(){
  realms.forEach((name,i)=>{const b=button('',()=>{const index=catalogue.findIndex(d=>d.level===i+1);if(index>=0)selectDesign(index);});b.append(el('span','',String(i+1).padStart(2,'0')+' / 境'),el('b','',name));b.disabled=!catalogue.some(d=>d.level===i+1);$('realms').append(b);});
  Object.entries(modes).forEach(([key,name])=>{const b=button(name,()=>setMode(key));b.dataset.mode=key;$('modes').append(b);});
  $('views').querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>{state.theta={front:0,side:Math.PI/2,back:Math.PI,three:.38}[b.dataset.angle];state.phi=1.44;state.radius=idealRadius;setAuto(false);markAngles(b.dataset.angle);requestRender();}));
  $('auto').addEventListener('click',()=>setAuto(!state.auto));$('reset').addEventListener('click',()=>{state.theta=.38;state.phi=1.44;fit();setAuto(false);markAngles('three');requestRender();});
  $('download-obj').addEventListener('click',()=>download(E.exportOBJ(root),catalogue[state.index].id+'-'+state.mode+'.obj','text/plain'));
  $('download-json').addEventListener('click',()=>download(JSON.stringify(catalogue[state.index],null,2),catalogue[state.index].id+'.json','application/json'));
  $('show-all').addEventListener('click',()=>filterMatrix(false));$('show-realm').addEventListener('click',()=>filterMatrix(true));
}
function markAngles(angle){$('views').querySelectorAll('[data-angle]').forEach(b=>mark(b,b.dataset.angle===angle));}
function setAuto(on){state.auto=on;mark($('auto'),on);requestRender();}
function setupMatrix(){
  realms.forEach((realm,i)=>{
    const designs=catalogue.map((d,index)=>({d,index})).filter(x=>x.d.level===i+1);if(!designs.length)return;
    const row=el('div','matrix-row');row.dataset.level=i+1;const label=el('div','realm-label');label.append(el('span','',String(i+1).padStart(2,'0')),document.createTextNode(realm));row.append(label);
    designs.forEach(({d,index},j)=>{
      const card=button('',()=>{selectDesign(index);stage.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});});card.className='tile';card.dataset.index=index;card.setAttribute('aria-label',realm+' · '+d.name);
      const placeholder=el('div','thumb-pending','模型渲染中');card.append(placeholder,el('span','number',String(i+1).padStart(2,'0')+'.'+(j+1)));
      const caption=el('figure');caption.append(el('b','',d.name),el('small','',d.style));card.append(caption);row.append(card);cards[index]={card,placeholder};if(cachedThumbs[d.id]){const img=el('img');img.alt=d.name+'的同源三维渲染';img.width=240;img.height=300;img.src=cachedThumbs[d.id];placeholder.replaceWith(img);stats.thumbnailCount++;stats.cachedThumbnailCount++;}else thumbnailQueue.push(index);
    });$('matrix').append(row);
  });
}
function filterMatrix(only){state.onlyRealm=only;mark($('show-all'),!only);mark($('show-realm'),only);$('matrix').querySelectorAll('[data-level]').forEach(r=>{r.hidden=only&&Number(r.dataset.level)!==state.level;});}
function selectDesign(index){
  if(!Number.isInteger(index)||!catalogue[index])throw new Error('无效设计索引 '+index);
  state.index=index;state.level=catalogue[index].level;const d=catalogue[index];
  $('realms').querySelectorAll('button').forEach((b,i)=>mark(b,i+1===state.level));
  $('styles').replaceChildren();catalogue.forEach((s,i)=>{if(s.level!==state.level)return;const b=button(s.name,()=>selectDesign(i));mark(b,i===index);$('styles').append(b);});
  cards.forEach((c,i)=>mark(c.card,i===index));filterMatrix(state.onlyRealm);
  $('design-index').textContent='第 '+d.level+' 境 / '+d.realm+' / '+d.style;
  [['design-name',d.name],['tagline',d.tagline],['description',d.description],['silhouette',d.silhouette],['progression',d.progression],['segmentation',d.segmentation],['material-story',d.materialStory],['ingot-name',d.ingot.name],['ingot-description',d.ingot.description]].forEach(([id,t])=>{$(id).textContent=t;});
  $('palette').replaceChildren();d.palette.forEach(color=>{const chip=el('div','chip'),swatch=el('span','swatch');swatch.style.background=color;chip.append(swatch,document.createTextNode(color.toUpperCase()));$('palette').append(chip);});
  $('materials').replaceChildren();Object.entries(d.materials).forEach(([key,m])=>{const row=el('div','material'),swatch=el('span','swatch');swatch.style.background=m.color;const info=el('div');info.append(el('b','',m.name),el('small','',m.color.toUpperCase()+' · '+materialLabel(m)));row.append(swatch,info);row.title='金属度 '+m.metalness+' / 粗糙度 '+m.roughness+' / 不透明度 '+(m.opacity===undefined?1:m.opacity);$('materials').append(row);});
  $('parts').replaceChildren();Object.entries(d.parts).forEach(([key,part])=>{const article=el('article','part'),b=button('单看',()=>{setMode(key);stage.scrollIntoView({behavior:'smooth',block:'center'});});article.append(b,el('h3','',part.name),el('p','',part.description));$('parts').append(article);});
  setMode(state.mode);document.title=d.realm+' · '+d.name+' | 五境衣甲';
}
function materialLabel(m){if((m.opacity===undefined?1:m.opacity)<.92)return '透光灵材';if(m.metalness>=.6)return '金属';if(m.roughness>=.5)return '织物 / 哑光';return '玉石 / 光洁';}
function setMode(mode){
  if(!Object.prototype.hasOwnProperty.call(modes,mode))throw new Error('无效观看模式 '+mode);state.mode=mode;
  if(root){E.dispose(root);stats.liveDesignGroups--;root=null;}
  const d=catalogue[state.index];root=mode==='ingot'?E.buildIngot(d):E.buildDesign(d,{avatar:mode==='all'});
  if(mode!=='all'&&mode!=='ingot'){
    root.children.slice().forEach(child=>{if(child.userData.role!==mode){root.remove(child);child.traverse(n=>{if(n.geometry)n.geometry.dispose();});}});
  }
  if(mode==='ingot'){const box=new T.Box3().setFromObject(root);root.position.y=.006-box.min.y;}
  scene.add(root);stats.liveDesignGroups++;stats.maxLiveDesignGroups=Math.max(stats.maxLiveDesignGroups,stats.liveDesignGroups);
  $('modes').querySelectorAll('button').forEach(b=>mark(b,b.dataset.mode===mode));
  $('stage-label').textContent=d.realm+' / '+d.name;$('view-label').textContent=modes[mode];
  const s=E.meshStats(root);$('diagnostics').textContent=s.components+' 个组件 · '+s.meshes+' 个网格\n'+s.vertices.toLocaleString()+' 顶点 · '+s.triangles.toLocaleString()+' 三角形\n当前内容：'+modes[mode]+' / OBJ 采用世界坐标，含顶点法线与材质分组';
  fit();requestRender();
}
function fit(){
  if(!root)return;root.updateWorldMatrix(true,true);const bounds=new T.Box3().setFromObject(root),size=bounds.getSize(new T.Vector3());focus=bounds.getCenter(new T.Vector3());
  const aspect=Math.max(.25,stage.clientWidth/stage.clientHeight),vfov=camera.fov*Math.PI/180,hfov=2*Math.atan(Math.tan(vfov/2)*aspect);
  // Front, side, back and turntable share one conservative framing distance.
  const width=Math.sqrt(size.x*size.x+size.z*size.z),radius=Math.max(size.y/(2*Math.tan(vfov/2)),width/(2*Math.tan(hfov/2)))*1.17+size.z*.4;
  idealRadius=Math.max(.25,radius);state.radius=idealRadius;
}
function resize(){if(!renderer||disposed)return;renderer.setSize(Math.max(1,stage.clientWidth),Math.max(1,stage.clientHeight),false);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();fit();requestRender();}
function requestRender(){if(!renderFrame&&!disposed&&!contextLost)renderFrame=requestAnimationFrame(render);}
let previousFrame=0;
function render(time){
  renderFrame=0;if(disposed||contextLost)return;if(state.auto&&document.visibilityState!=='hidden'){state.theta+=Math.min(50,time-previousFrame||16)*.00016;}previousFrame=time;
  const sin=Math.sin(state.phi);camera.position.set(focus.x+state.radius*sin*Math.sin(state.theta),focus.y+state.radius*Math.cos(state.phi),focus.z+state.radius*sin*Math.cos(state.theta));camera.lookAt(focus);renderer.render(scene,camera);if(state.auto&&document.visibilityState!=='hidden')requestRender();
}
function setupPointer(){
  const active=new Map();let drag=null,pinch=0;
  stage.addEventListener('pointerdown',e=>{if(e.target!==renderer.domElement)return;stage.setPointerCapture(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY};pinch=distance();setAuto(false);});
  const distance=()=>{const p=[...active.values()];return p.length===2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0;};
  stage.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===2){const d=distance();if(pinch>0)state.radius*=pinch/d;pinch=d;}else if(drag){state.theta-=(e.clientX-drag.x)*.007;state.phi-=(e.clientY-drag.y)*.006;markAngles('');}drag={x:e.clientX,y:e.clientY};clampView();requestRender();});
  const end=e=>{active.delete(e.pointerId);drag=null;pinch=0;if(active.size===1){const p=[...active.values()][0];drag={...p};}};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  stage.addEventListener('wheel',e=>{e.preventDefault();state.radius*=Math.exp(Math.max(-180,Math.min(180,e.deltaY))*.0014);clampView();requestRender();},{passive:false});
  renderer.domElement.addEventListener('keydown',e=>{const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','='];if(!keys.includes(e.key))return;e.preventDefault();setAuto(false);if(e.key==='ArrowLeft')state.theta-=.12;if(e.key==='ArrowRight')state.theta+=.12;if(e.key==='ArrowUp')state.phi-=.1;if(e.key==='ArrowDown')state.phi+=.1;if(e.key==='+'||e.key==='=')state.radius*=.9;if(e.key==='-')state.radius*=1.1;clampView();markAngles('');requestRender();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestRender();});
}
function clampView(){state.phi=Math.max(.28,Math.min(Math.PI-.28,state.phi));state.radius=Math.max(idealRadius*.32,Math.min(idealRadius*2.5,state.radius));}
function scheduleThumb(){if(!thumbnailQueue.length){$('thumb-status').textContent='全部 '+catalogue.length+' 套真实模型';return;}if(disposed)return;thumbnailTimer=setTimeout(renderThumbnail,70);}
function renderThumbnail(){
  if(disposed||contextLost)return;const index=thumbnailQueue.shift();if(index===undefined)return;
  let model,target;
  try{
    model=E.buildDesign(catalogue[index],{avatar:true});stats.liveDesignGroups++;stats.maxLiveDesignGroups=Math.max(stats.maxLiveDesignGroups,stats.liveDesignGroups);
    const hiddenRoot=root.visible;root.visible=false;scene.add(model);
    const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());
    const cam=new T.PerspectiveCamera(32,4/5,.02,50),fov=32*Math.PI/180,rad=Math.max(size.y/(2*Math.tan(fov/2)),Math.hypot(size.x,size.z)/(2*Math.tan(fov/2)*.8))*1.13;
    const extent=Math.max(size.x,size.y,size.z);cam.near=Math.max(.01,rad-extent*1.1);cam.far=rad+extent*1.5+1;cam.updateProjectionMatrix();
    cam.near=Math.max(.1,rad-size.length()*.65);cam.far=rad+size.length()*1.4;cam.updateProjectionMatrix();cam.position.copy(center).add(new T.Vector3(rad*.25,rad*.10,rad*.963));cam.lookAt(center);
    const w=480,h=600;target=new T.WebGLRenderTarget(w,h,{minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat,encoding:T.sRGBEncoding});
    renderer.setRenderTarget(target);renderer.render(scene,cam);const bytes=new Uint8Array(w*h*4);renderer.readRenderTargetPixels(target,0,0,w,h,bytes);renderer.setRenderTarget(null);root.visible=hiddenRoot;
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d'),imageData=ctx.createImageData(w,h);
    for(let y=0;y<h;y++)imageData.data.set(bytes.subarray((h-y-1)*w*4,(h-y)*w*4),y*w*4);ctx.putImageData(imageData,0,0);
    const resolved=document.createElement('canvas');resolved.width=240;resolved.height=300;const res=resolved.getContext('2d');res.imageSmoothingEnabled=true;res.imageSmoothingQuality='high';res.drawImage(canvas,0,0,240,300);
    const img=el('img');img.alt=catalogue[index].name+'的真实三维渲染';img.width=240;img.height=300;img.src=resolved.toDataURL('image/png');cards[index].placeholder.replaceWith(img);stats.thumbnailCount++;
    $('thumb-status').textContent=stats.thumbnailCount===catalogue.length?'全部 '+catalogue.length+' 套真实模型':'已渲染 '+stats.thumbnailCount+' / '+catalogue.length+' 套';
  }catch(err){stats.errors.push(String(err.stack||err));console.error(err);cards[index].placeholder.textContent='此模型渲染失败';}
  finally{renderer.setRenderTarget(null);if(root)root.visible=true;if(target)target.dispose();if(model){E.dispose(model);stats.liveDesignGroups--;}requestRender();scheduleThumb();}
}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function cleanup(){if(disposed)return;disposed=true;cancelAnimationFrame(renderFrame);clearTimeout(thumbnailTimer);if(resizeObserver)resizeObserver.disconnect();if(root){E.dispose(root);root=null;stats.liveDesignGroups--;}if(scene)E.dispose(scene);if(environment)environment.dispose();if(renderer){renderer.dispose();renderer.forceContextLoss();}stats.ready=false;}
try{init();}catch(err){error(err);}
})();
</script>
